<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نَقَاء — رفيقك للتحرر من أظرف النيكوتين</title>
  <meta name="description" content="نَقَاء: رفيق هادئ وتفاعلي يساعدك على التحرر من أظرف النيكوتين خلال ٣٠ يوماً — شجرة تنمو مع كل يوم، أدوات نجدة للرغبة، ورؤى تكشف أنماطك." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="نَقَاء" />
  <meta name="theme-color" content="#0A0F0D" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       DESIGN TOKENS
       ========================================================= */
    :root {
      --font: 'Readex Pro', 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif;
      --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --tabbar-h: 74px;
    }
    :root, [data-theme="dark"] {
      color-scheme: dark;
      --bg: #0F1513;
      --glow-1: rgba(134, 184, 160, .06);
      --glow-2: rgba(0, 0, 0, 0);
      --surface: #141B18;
      --surface-2: #1B2420;
      --surface-3: #232D29;
      --glass: rgba(20, 27, 24, .92);
      --line: rgba(230, 233, 228, .06);
      --line-2: rgba(230, 233, 228, .12);
      --ink: #E6E9E4;
      --ink-2: #A9B3AD;
      --ink-3: #8E9993;
      --sage: #86B8A0;
      --sage-2: #6FA58C;
      --sage-ink: #A9CDBA;
      --sage-soft: rgba(134, 184, 160, .12);
      --sand: #D8B27A;
      --sand-ink: #E2C496;
      --sand-soft: rgba(216, 178, 122, .12);
      --rose: #D99488;
      --rose-soft: rgba(217, 148, 136, .12);
      --on-accent: #0E1412;
      --shadow: none;
      --grain-o: .025;
    }
    [data-theme="light"] {
      color-scheme: light;
      --bg: #F4F2EC;
      --glow-1: rgba(58, 114, 89, .05);
      --glow-2: rgba(0, 0, 0, 0);
      --surface: #FFFFFF;
      --surface-2: #F8F6F1;
      --surface-3: #EDEAE2;
      --glass: rgba(255, 255, 255, .94);
      --line: rgba(28, 37, 33, .07);
      --line-2: rgba(28, 37, 33, .13);
      --ink: #1C2521;
      --ink-2: #4A5550;
      --ink-3: #5F6A64;
      --sage: #3A7259;
      --sage-2: #2F5F49;
      --sage-ink: #2F5F49;
      --sage-soft: rgba(58, 114, 89, .09);
      --sand: #8E6427;
      --sand-ink: #7A5520;
      --sand-soft: rgba(142, 100, 39, .10);
      --rose: #A65446;
      --rose-soft: rgba(166, 84, 70, .09);
      --on-accent: #FFFFFF;
      --shadow: 0 1px 2px rgba(28, 37, 33, .05);
      --grain-o: 0;
    }

    /* =========================================================
       BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      background-image:
        radial-gradient(120% 60% at 50% -10%, var(--glow-1) 0%, transparent 60%),
        radial-gradient(80% 50% at 90% 110%, var(--glow-2) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color .4s var(--ease), color .4s var(--ease);
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--grain-o);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: .4; }
    :focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; border-radius: 10px; }
    ::selection { background: var(--sage-soft); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }

    .ic { width: 20px; height: 20px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
    .ic.sm { width: 16px; height: 16px; }
    .ic.xs { width: 14px; height: 14px; }
    .ic.lg { width: 26px; height: 26px; }
    .ic.xl { width: 34px; height: 34px; }

    .app {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(var(--safe-t) + 14px) 16px calc(var(--tabbar-h) + var(--safe-b) + 28px);
    }
    .view { display: flex; flex-direction: column; gap: 14px; }
    .view.enter { animation: viewIn .45s var(--ease) both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* =========================================================
       TYPOGRAPHY & UTILITIES
       ========================================================= */
    .h1 { font-size: 23px; font-weight: 700; letter-spacing: -.2px; margin: 0; line-height: 1.35; }
    .h2 { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.45; }
    .h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.5; }
    .body { font-size: 14px; line-height: 1.85; color: var(--ink-2); margin: 0; }
    .small { font-size: 13px; }
    .xs { font-size: 12px; }
    .muted { color: var(--ink-3); }
    .ink2 { color: var(--ink-2); }
    .sage { color: var(--sage-ink); }
    .sand { color: var(--sand-ink); }
    .rose { color: var(--rose); }
    .bold { font-weight: 700; }
    .num { font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sep { height: 1px; background: var(--line); margin: 4px 0; border: 0; }
    .center { text-align: center; }
    .serif { font-family: var(--font-serif); }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* =========================================================
       COMPONENTS
       ========================================================= */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 6px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--sage-soft);
      color: var(--sage-ink);
    }
    .eyebrow { font-size: 12px; color: var(--ink-3); margin: 0; }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card.tight { padding: 14px; }
    .card.flat { box-shadow: none; }
    .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .ibox {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center; flex-shrink: 0;
      background: var(--sage-soft); color: var(--sage-ink);
    }
    .ibox.sand { background: var(--sand-soft); color: var(--sand-ink); }
    .ibox.rose { background: var(--rose-soft); color: var(--rose); }
    .ibox.sm { width: 32px; height: 32px; border-radius: 11px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      padding: 5px 11px; border-radius: 99px;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .chip.sage { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .chip.sand { background: var(--sand-soft); color: var(--sand-ink); border-color: transparent; }
    .chip.rose { background: var(--rose-soft); color: var(--rose); border-color: transparent; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 0 18px;
      border-radius: 16px;
      font-size: 14px; font-weight: 700;
      background: var(--surface-2); color: var(--ink);
      border: 1px solid var(--line);
      transition: transform .15s var(--ease), background .2s, border-color .2s, opacity .2s;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn.primary { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .btn.sand { background: var(--sand); color: var(--on-accent); border-color: transparent; }
    .btn.soft { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .btn.soft-sand { background: var(--sand-soft); color: var(--sand-ink); border-color: transparent; }
    .btn.danger { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.block { width: 100%; }
    .btn.sm { min-height: 36px; padding: 0 13px; font-size: 13px; border-radius: 12px; }
    .btn.grad { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .btn:disabled { opacity: 1; background: var(--surface-3); color: var(--ink-3); border-color: transparent; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 99px;
      display: grid; place-items: center;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      transition: transform .15s var(--ease), color .2s;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn.sm { width: 34px; height: 34px; }

    .seg {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      padding: 4px; gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 99px;
    }
    .seg button {
      min-height: 38px; border-radius: 99px;
      font-size: 13px; font-weight: 600; color: var(--ink-3);
      transition: background .25s var(--ease), color .25s;
    }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 4px 14px -6px rgba(0,0,0,.35); border: 1px solid var(--line); }

    .opt {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 6px; border-radius: 16px;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      font-size: 12px; font-weight: 600;
      transition: all .2s var(--ease);
    }
    .opt.inline { flex-direction: row; padding: 9px 12px; }
    .opt[aria-pressed="true"] { background: var(--sage-soft); border-color: var(--sage); color: var(--sage-ink); }
    .opt.sand[aria-pressed="true"] { background: var(--sand-soft); border-color: var(--sand); color: var(--sand-ink); }
    .opt.rose[aria-pressed="true"] { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
    .input {
      width: 100%; min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      color: var(--ink);
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea.input { resize: vertical; min-height: 96px; line-height: 1.8; }
    .input:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
    .input[dir="ltr"] { text-align: left; }
    select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: 18px 50%, 13px 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-left: 30px; }

    .bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--sage); transition: width .8s var(--ease); }
    .bar.thin { height: 5px; }

    .switch { position: relative; width: 48px; height: 28px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-2); transition: background .25s; flex-shrink: 0; }
    .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-3); transition: transform .25s var(--ease), background .25s; }
    .switch[aria-checked="true"] { background: var(--sage); }
    .switch[aria-checked="true"]::after { transform: translateX(-20px); background: var(--on-accent); }

    /* =========================================================
       HERO / SCENE
       ========================================================= */
    .hero { padding: 0; overflow: hidden; }
    .scene { position: relative; aspect-ratio: 360 / 240; height: auto; overflow: hidden; border-radius: var(--r-xl) var(--r-xl) 0 0; }
    .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scene-fade { position: absolute; inset: auto 0 0 0; height: 60px; background: linear-gradient(0deg, var(--surface), transparent); pointer-events: none; }
    .scene-badge { position: absolute; top: 14px; right: 14px; }
    .scene-badge2 { position: absolute; top: 14px; left: 14px; }
    .glass-chip { background: rgba(10, 15, 13, .45); color: #F2EEE7; border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .hero-body { padding: 16px 20px 20px; position: relative; }
    .counter { display: flex; align-items: baseline; gap: 8px; }
    .counter .big { font-size: 54px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
    .clock { font-size: 15px; color: var(--ink-2); font-weight: 500; letter-spacing: .5px; }
    .clock b { color: var(--ink); font-weight: 600; }
    .leaf-pop { animation: leafPop .9s var(--ease) both; transform-box: fill-box; transform-origin: center; }
    @keyframes leafPop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
    .bud { animation: budPulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes budPulse { 0%,100% { opacity: .65; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    .firefly { animation: fly 6s ease-in-out infinite; }
    @keyframes fly { 0%,100% { transform: translate(0,0); opacity: .2; } 50% { transform: translate(8px,-10px); opacity: 1; } }
    .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .3; } }

    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 14px; display: flex; flex-direction: column; gap: 8px;
      box-shadow: var(--shadow);
    }
    .stat .v { font-size: 21px; font-weight: 700; line-height: 1.15; }
    .stat .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-inline-start: 3px; }
    .stat .l { font-size: 12px; color: var(--ink-3); }

    .quote {
      font-family: var(--font-serif);
      font-size: 21px; line-height: 1.8;
      text-align: center; margin: 0; color: var(--ink);
    }
    .quote-card { text-align: center; background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
    .quote-mark { color: var(--sand); opacity: .7; }

    .pouches { display: flex; flex-wrap: wrap; gap: 6px; }
    .pouch { width: 22px; height: 14px; border-radius: 6px; border: 1.5px solid var(--sand); opacity: .9; }
    .pouch.used { background: var(--sand); }
    .pouch.over { border-color: var(--rose); background: var(--rose); }

    .day-nav { display: flex; gap: 6px; }
    .callout { border-radius: 18px; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); }
    .callout.sand { background: var(--sand-soft); border-color: transparent; }
    .callout.sage { background: var(--sage-soft); border-color: transparent; }
    .callout-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }

    details.more summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--sage-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    details.more summary::-webkit-details-marker { display: none; }
    details.more[open] summary .ic { transform: rotate(180deg); }

    /* =========================================================
       JOURNEY PATH
       ========================================================= */
    .chapter-head { display: flex; align-items: center; gap: 12px; }
    .path-wrap { position: relative; width: 320px; max-width: 100%; margin: 6px auto 0; }
    .path-wrap svg.path-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .node {
      position: absolute; transform: translate(-50%, -50%);
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      font-weight: 700; font-size: 16px;
      background: var(--surface-2); color: var(--ink-3);
      border: 2px solid var(--line-2);
      transition: transform .2s var(--ease);
    }
    .node:active:not(:disabled) { transform: translate(-50%, -50%) scale(.93); }
    .node.done { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .node.ms { width: 60px; height: 60px; }
    .node.ms.done { background: var(--sand); }
    .node.current { background: var(--surface); color: var(--ink); border: 3px solid var(--sage); animation: nodePulse 2.6s ease-in-out infinite; width: 62px; height: 62px; font-size: 19px; }
    .node.locked { opacity: .55; }
    .node .tick { position: absolute; bottom: -3px; left: -3px; width: 22px; height: 22px; border-radius: 50%; background: var(--sand); color: var(--on-accent); display: grid; place-items: center; border: 2px solid var(--surface); }
    .node .crown { position: absolute; top: -12px; color: var(--sand); }
    @keyframes nodePulse { 0%,100% { box-shadow: 0 0 0 0 var(--sage-soft); } 50% { box-shadow: 0 0 0 12px transparent; } }
    .node-label { position: absolute; transform: translateY(-50%); width: 118px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
    .node-label b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 600; }
    .node-label .tag { color: var(--sand-ink); font-weight: 700; font-size: 11.5px; display: block; }

    .timeline { position: relative; display: flex; flex-direction: column; gap: 10px; }
    .tl-item { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
    .tl-dot { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
    .tl-item.done .tl-dot { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .tl-item.next .tl-dot { background: var(--sand-soft); color: var(--sand-ink); border-color: var(--sand); }

    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge {
      display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
      padding: 14px 6px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .badge .medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-3); position: relative; }
    .badge.on .medal { background: var(--sand); color: var(--on-accent); }
    .badge.on.sage-m .medal { background: var(--sage); color: var(--on-accent); }
    .badge .medal .lk { position: absolute; bottom: -2px; left: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; border: 1px solid var(--line-2); }
    .badge .nm { font-size: 12px; font-weight: 600; line-height: 1.4; }
    .badge:not(.on) .nm { color: var(--ink-3); }

    /* =========================================================
       SOS
       ========================================================= */
    .sos-hero { text-align: center; padding: 28px 20px 24px; overflow: hidden; }
    .sos-orb {
      position: relative;
      width: 176px; height: 176px; border-radius: 50%;
      margin: 18px auto 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: var(--sage-soft);
      border: 1px solid var(--sage);
      color: var(--ink);
      transition: transform .2s var(--ease);
    }
    .sos-orb:active { transform: scale(.96); }
    .sos-orb::before, .sos-orb::after {
      content: ""; position: absolute; inset: -1px; border-radius: 50%;
      border: 1px solid var(--sage);
      animation: ripple 3.6s ease-out infinite;
    }
    .sos-orb::after { animation-delay: 1.8s; }
    @keyframes ripple { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.45); opacity: 0; } }

    .session {
      position: fixed; inset: 0; z-index: 60;
      background: var(--bg);
      background-image: radial-gradient(90% 50% at 50% 0%, var(--glow-1), transparent 70%);
      overflow-y: auto;
      animation: viewIn .35s var(--ease) both;
    }
    .session-inner { max-width: 480px; margin: 0 auto; padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px); display: flex; flex-direction: column; gap: 14px; }
    .timer-big { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .wave-svg { width: 100%; height: 110px; display: block; }
    .breath-stage { position: relative; width: 220px; height: 220px; margin: 8px auto; display: grid; place-items: center; }
    .breath-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line-2); }
    .breath-orb {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--sage-soft);
      border: 1px solid var(--sage);
      box-shadow: 0 0 40px -18px var(--sage);
      transition-property: transform; transition-timing-function: ease-in-out; transition-duration: 1s;
    }
    .breath-orb .ph { font-size: 15px; font-weight: 700; color: var(--ink); }
    .breath-orb .sec { font-size: 30px; font-weight: 700; color: var(--sand-ink); line-height: 1.1; }
    .game-box { position: relative; height: 300px; border-radius: 22px; overflow: hidden; background: radial-gradient(circle at 50% 120%, var(--sage-soft), var(--surface) 70%); border: 1px solid var(--line); }
    .game-box canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .game-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .letter { font-family: var(--font-serif); font-size: 19px; line-height: 1.95; color: var(--ink); white-space: pre-wrap; margin: 0; }

    /* =========================================================
       CHARTS
       ========================================================= */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 22px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; cursor: default; }
    .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
    .bar-fill { width: 62%; min-height: 3px; border-radius: 4px 4px 0 0; background: var(--sage); opacity: .5; transition: height .8s var(--ease), opacity .2s; }
    .bar-fill.peak { opacity: 1; }
    .bar-col:hover .bar-fill { opacity: .85; }
    .bar-val { position: absolute; font-size: 11.5px; font-weight: 700; color: var(--ink); transform: translateY(-20px); }
    .bar-lbl { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
    .baseline { height: 1px; background: var(--line-2); margin-top: -1px; }
    .hbar { display: grid; grid-template-columns: 96px 1fr 28px; gap: 10px; align-items: center; font-size: 13px; }
    .hbar .track { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .hbar .track i { display: block; height: 100%; border-radius: 4px; background: var(--sage); }
    .chart-svg { width: 100%; display: block; overflow: visible; }

    #tip {
      position: fixed; z-index: 90; pointer-events: none;
      background: var(--ink); color: var(--bg);
      font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 10px;
      transform: translate(-50%, calc(-100% - 10px));
      white-space: nowrap; opacity: 0; transition: opacity .15s;
    }
    #tip.on { opacity: 1; }

    /* =========================================================
       LIST ROWS (settings)
       ========================================================= */
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); }
    .list-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: right; border-bottom: 1px solid var(--line); min-height: 60px; }
    .list-row:last-child { border-bottom: 0; }
    button.list-row:active { background: var(--surface-2); }
    .list-row .t { font-size: 14px; font-weight: 600; }
    .list-row .s { font-size: 12px; color: var(--ink-3); }
    .group-title { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin: 8px 6px -4px; }

    /* =========================================================
       TABBAR
       ========================================================= */
    .tabbar {
      position: fixed; z-index: 40;
      bottom: calc(var(--safe-b) + 12px); left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 456px;
      height: 66px;
      display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
      padding: 0 6px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--line-2);
      border-radius: 24px;
      box-shadow: 0 10px 30px -18px rgba(0,0,0,.5);
    }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; font-size: 11.5px; font-weight: 600; color: var(--ink-3); transition: color .2s; }
    .tab .ic { width: 22px; height: 22px; transition: transform .25s var(--ease); }
    .tab[aria-current="page"] { color: var(--ink); }
    .tab[aria-current="page"] .ic { color: var(--sage); transform: translateY(-1px); }
    .tab-sos .sos-core {
      width: 54px; height: 54px; margin-top: -30px; border-radius: 50%;
      display: grid; place-items: center;
      background: var(--sage);
      color: var(--on-accent);
      box-shadow: 0 0 0 5px var(--bg);
    }
    .tab-sos .sos-core .ic { color: var(--on-accent) !important; }

    /* =========================================================
       SHEETS, ONBOARDING, TOAST
       ========================================================= */
    .sheet-layer { position: fixed; inset: 0; z-index: 88; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn .25s both; }
    .sheet {
      position: relative; width: 100%; max-width: 480px; max-height: 90vh; max-height: 90dvh; overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line-2); border-bottom: 0;
      border-radius: 30px 30px 0 0;
      padding: 10px 20px calc(var(--safe-b) + 22px);
      animation: sheetUp .38s var(--ease) both;
    }
    .sheet-handle { width: 40px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 2px auto 14px; }
    .sheet-body { display: flex; flex-direction: column; gap: 14px; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .onb { position: fixed; inset: 0; z-index: 80; background: var(--bg); background-image: radial-gradient(120% 60% at 50% -10%, var(--glow-1), transparent 60%), radial-gradient(80% 50% at 90% 110%, var(--glow-2), transparent 60%); overflow-y: auto; }
    .onb-inner { max-width: 480px; min-height: 100%; margin: 0 auto; padding: calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 22px); display: flex; flex-direction: column; gap: 18px; }
    .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; }
    .steps i { height: 4px; border-radius: 99px; background: var(--surface-3); transition: background .3s; }
    .steps i.on { background: var(--sage); }
    .onb-body { display: flex; flex-direction: column; gap: 16px; animation: viewIn .4s var(--ease) both; flex: 1; }
    .onb-actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding-top: 8px; }
    .path-card { text-align: right; padding: 16px; border-radius: 22px; background: var(--surface); border: 1.5px solid var(--line); display: flex; gap: 14px; align-items: flex-start; transition: border-color .2s, background .2s; width: 100%; }
    .path-card[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-soft); }
    .path-card.sandy[aria-pressed="true"] { border-color: var(--sand); background: var(--sand-soft); }
    .welcome-hero { text-align: center; padding-top: 18px; }
    .welcome-logo { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 28px; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage-ink); }
    .feature { display: flex; gap: 12px; align-items: flex-start; text-align: right; }

    #toast {
      position: fixed; z-index: 95; top: calc(var(--safe-t) + 14px); left: 50%;
      transform: translate(-50%, calc(-100% - 60px));
      visibility: hidden;
      max-width: calc(100% - 32px);
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 99px;
      background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-2);
      font-size: 13px; font-weight: 600;
      box-shadow: 0 14px 30px -12px rgba(0,0,0,.5);
      transition: transform .4s var(--ease), visibility 0s .4s;
    }
    #toast.on { transform: translate(-50%, 0); visibility: visible; transition: transform .4s var(--ease); }
    #confetti { position: fixed; inset: 0; z-index: 96; pointer-events: none; width: 100%; height: 100%; }

    .strip { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; text-align: center; padding: 14px 6px; }
    .strip > div + div { border-inline-start: 1px solid var(--line); }
    .strip .v { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .strip .v small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
    .strip .l { font-size: 12px; color: var(--ink-3); }
    #float-words { position: absolute; inset: 0; pointer-events: none; }
    .float-word {
      position: absolute; left: 26.7%; top: 80%;
      transform: translate(-50%, -50%);
      font-size: 13.5px; font-weight: 600; white-space: nowrap;
      color: #EEF1EC; background: rgba(15, 21, 19, .55);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 4px 12px; border-radius: 99px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      animation: wordRise 5.2s ease-in-out forwards;
    }
    [data-theme="light"] .float-word { color: var(--ink); background: rgba(255, 255, 255, .82); border-color: var(--line-2); }
    @keyframes wordRise {
      0% { opacity: 0; left: 26.7%; top: 80%; transform: translate(-50%, -50%) scale(.7); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; left: 46%; top: 26%; transform: translate(-50%, -50%) scale(.96); }
    }
    @media (prefers-reduced-motion: reduce) { .float-word { animation: none !important; left: 50%; top: 18%; opacity: 1; } }
    .scene.compact { aspect-ratio: 360 / 170; }
    .scene.compact .float-word { animation-name: wordRiseC; top: 74%; }
    @keyframes wordRiseC {
      0% { opacity: 0; left: 26.7%; top: 74%; transform: translate(-50%, -50%) scale(.7); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; left: 46%; top: 16%; transform: translate(-50%, -50%) scale(.96); }
    }
    .next-task { background: var(--sage-soft); border-radius: 18px; padding: 14px; margin-bottom: 8px; }
    .tasks { display: flex; flex-direction: column; }
    .task { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: right; padding: 11px 2px; border-top: 1px solid var(--line); }
    .task:first-child { border-top: 0; }
    .task .t { display: block; color: var(--ink); line-height: 1.7; }
    .task[aria-pressed="true"] .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
    .tick-box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; color: var(--on-accent); }
    .task[aria-pressed="true"] .tick-box { background: var(--sage); border-color: transparent; }
    .day-dots { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .dd { width: 30px; height: 30px; border-radius: 50%; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
    .dd.done { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .dd.ms { border-color: var(--sand); }
    .dd.cur { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .day-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; padding: 10px 4px; border-top: 1px solid var(--line); }
    .day-row.cur { background: var(--sage-soft); border-radius: 12px; border-top-color: transparent; padding-inline: 8px; }
    .plan-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .plan-row:last-child { border-bottom: 0; }
    .empty { text-align: center; padding: 26px 18px; }
    .empty .ibox { margin: 0 auto 12px; width: 56px; height: 56px; border-radius: 20px; }

    @media (min-width: 560px) {
      .app { padding-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }
  </style>
</head>
<body>
  <noscript><p style="padding:24px;text-align:center">يحتاج نَقَاء إلى تفعيل JavaScript ليعمل.</p></noscript>

  <div class="app">
    <main id="view-today" class="view" aria-label="اليوم"></main>
    <main id="view-journey" class="view" aria-label="الرحلة" hidden></main>
    <main id="view-sos" class="view" aria-label="النجدة" hidden></main>
    <main id="view-insights" class="view" aria-label="رؤى" hidden></main>
    <main id="view-me" class="view" aria-label="أنا" hidden></main>
  </div>

  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <button class="tab" data-action="tab" data-tab="today" aria-current="page"><i data-i="sun"></i><span>اليوم</span></button>
    <button class="tab" data-action="tab" data-tab="journey"><i data-i="route"></i><span>الرحلة</span></button>
    <button class="tab tab-sos" data-action="tab" data-tab="sos" aria-label="النجدة: أدوات تجاوز الرغبة"><span class="sos-core"><i data-i="wind"></i></span><span>نجدة</span></button>
    <button class="tab" data-action="tab" data-tab="insights"><i data-i="chart-column"></i><span>رؤى</span></button>
    <button class="tab" data-action="tab" data-tab="me"><i data-i="user"></i><span>أنا</span></button>
  </nav>

  <!-- Full-screen SOS session -->
  <section id="session" class="session" hidden role="dialog" aria-modal="true" aria-label="جلسة عبور الموجة">
    <div class="session-inner">
      <div class="row between">
        <button class="btn sm" data-action="sessionEnd"><i data-i="x" class="sm"></i>إنهاء</button>
        <div class="center">
          <div class="xs muted">جلسة العبور</div>
          <div id="ss-timer" class="timer-big num">٠٣:٠٠</div>
        </div>
        <button class="icon-btn" data-action="sessionPause" id="ss-pause" aria-label="إيقاف مؤقت"><i data-i="pause" class="sm"></i></button>
      </div>

      <div class="card tight">
        <svg id="ss-wave" class="wave-svg" viewBox="0 0 320 110" preserveAspectRatio="none" aria-hidden="true"></svg>
        <p id="ss-phase" class="small center bold" style="margin:6px 0 0">الموجة ترتفع — تنفّس معها، لا تقاومها</p>
      </div>

      <div class="seg" role="tablist" id="ss-tools">
        <button data-action="sessionTool" data-tool="breath" aria-pressed="true">تنفّس</button>
        <button data-action="sessionTool" data-tool="touch" aria-pressed="false">لمس هادئ</button>
        <button data-action="sessionTool" data-tool="remind" aria-pressed="false">تذكير</button>
      </div>

      <div id="ss-tool-breath" class="col"></div>
      <div id="ss-tool-touch" class="col" hidden>
        <div class="row between small">
          <span class="muted">المس الكرات قبل أن تتلاشى — الذهبية بثلاث نقاط</span>
          <span class="row" style="gap:12px"><span class="sand bold num" id="gm-score">٠</span><span class="sage bold num" id="gm-time">٦٠ث</span></span>
        </div>
        <div class="game-box">
          <canvas id="gm-canvas"></canvas>
          <div class="game-overlay" id="gm-overlay">
            <p class="h3" id="gm-title" style="margin:0">أشغل يديك وذهنك ٦٠ ثانية</p>
            <p class="xs muted" id="gm-best" style="margin:0"></p>
            <button class="btn primary" data-action="gameStart"><i data-i="play" class="sm"></i>ابدأ</button>
          </div>
        </div>
      </div>
      <div id="ss-tool-remind" class="col" hidden></div>

      <button class="btn grad block" data-action="sessionWon"><i data-i="shield-check" class="sm"></i>عبرت الموجة</button>
    </div>
  </section>

  <!-- Onboarding -->
  <section id="onb" class="onb" hidden role="dialog" aria-modal="true" aria-label="إعداد خطتك">
    <div class="onb-inner">
      <div class="row">
        <button class="icon-btn sm" data-action="onbBack" id="onb-back" aria-label="رجوع"><i data-i="chevron-right" class="sm"></i></button>
        <div class="steps" id="onb-steps"><i></i><i></i><i></i><i></i><i></i></div>
        <button class="icon-btn sm" data-action="onbClose" id="onb-close" aria-label="إغلاق"><i data-i="x" class="sm"></i></button>
      </div>
      <div class="onb-body" id="onb-body"></div>
      <div class="onb-actions" id="onb-actions"></div>
    </div>
  </section>

  <!-- Bottom sheet -->
  <div id="sheet-layer" class="sheet-layer" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-handle"></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"><span id="toast-ic"></span><span id="toast-text"></span></div>
  <div id="tip"></div>
  <canvas id="confetti"></canvas>
  <input id="import-file" type="file" accept="application/json" hidden />

  <script>
  'use strict';

      const L = TREE.leaf[d.day + 40] || TREE.leaf[d.day]; if (!L) return;
      const x = L.x, y = L.y - 2;
      s += `<g fill="${P.bloss}">${[0, 72, 144, 216, 288].map(a => `<circle cx="${(x + Math.cos(a * Math.PI / 180) * 2.6).toFixed(1)}" cy="${(y + Math.sin(a * Math.PI / 180) * 2.6).toFixed(1)}" r="2.1"/>`).join('')}</g>`;
    });
    if (m.free && !opts.static && !light) {
      s += `<g fill="${P.sun}">` + [[120, 120], [240, 110], [150, 80], [215, 150], [100, 160], [260, 140]].map(([x, y], i) => `<circle class="firefly" style="animation-delay:${i * .9}s" cx="${x}" cy="${y}" r="1.6"/>`).join('') + '</g>';
    }
    s += '</svg>';
    return s;
  }

  /* Words that rise from the old tin: the user's own reasons + concrete gains */
  const pouchW = n => plural(n, ['ظرفاً واحداً', 'ظرفين', 'أظرف', 'ظرفاً']);
  function floatWords(m) {
    const gains = [];
    if (m.saved >= 1) gains.push('وفّرت ' + nf(m.saved, 0) + ' ' + state.currency);
    if (m.avoided >= 1) gains.push('تجنّبت ' + pouchW(Math.floor(m.avoided)));
    if (m.cleanH >= 12) gains.push('قلبك أهدأ');
    if (m.cleanH >= 72) gains.push('جسدك خالٍ من النيكوتين');
    if (m.cleanH >= 120) gains.push('لثتك تلتئم');
    if (m.cleanH >= 168) gains.push('نَفَسك أنقى');
    if (m.cleanH >= 336) gains.push('نومك يتحسّن');
    if (m.cleanH >= 504) gains.push('ذهنك أصفى');
    if (m.goalPct >= 1) gains.push(nf(Math.floor(m.goalPct)) + '٪ نحو ' + (state.goalName.length > 16 ? state.goalName.slice(0, 15) + '…' : state.goalName));
    if (m.prep) gains.push('يوم إقلاعك يقترب', 'جهّز بدائلك');
    gains.push('حريتك تعود', 'أنت أقوى من ٣ دقائق');
    const out = [], R = state.reasons.slice();
    // interleave: a personal reason, then a gain
    while (R.length || gains.length) { if (R.length) out.push(R.shift()); if (gains.length) out.push(gains.shift()); }
    return out;
  }
  let wordsTimer = null, wordsIdx = 0;
  function startWords() {
    clearInterval(wordsTimer);
    const show = () => {
      const box = $('#float-words');
      if (!box || currentTab !== 'today' || document.hidden) return;
      const list = floatWords(metrics());
      const w = document.createElement('span');
      w.className = 'float-word';
      w.textContent = list[wordsIdx % list.length];
      wordsIdx++;
      box.replaceChildren(w);
    };
    if (state.showCan === false) { const b = $('#float-words'); if (b) b.replaceChildren(); return; }
    show();
    wordsTimer = setInterval(show, reduceMotion() ? 6000 : 5200);
  }

  /* =========================================================
     NAVIGATION
     ========================================================= */
  let currentTab = 'today';
  let previewDay = null;
  let journeySeg = 'path';
  const RENDER = {};
  function go(tab, opts = {}) {
    currentTab = tab;
    ['today', 'journey', 'sos', 'insights', 'me'].forEach(t => {
      const v = $('#view-' + t);
      v.hidden = t !== tab;
      v.classList.remove('enter');
    });
    $$('.tab').forEach(b => b.dataset.tab === tab ? b.setAttribute('aria-current', 'page') : b.removeAttribute('aria-current'));
    RENDER[tab]();
    const v = $('#view-' + tab);
    void v.offsetWidth; v.classList.add('enter');
    if (!opts.keepScroll) window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
  }
  const rerender = () => RENDER[currentTab]();

  /* =========================================================
     VIEW: TODAY
     ========================================================= */
  function greeting() {
    const h = new Date().getHours();
    const g = h < 5 ? 'ليلة هادئة' : h < 12 ? 'صباح النقاء' : h < 17 ? 'نهارك نقي' : 'مساء النقاء';
    return g + (state.name ? '، ' + esc(state.name) : '');
  }
  function nextStop(m) { return NEXT_STOPS.find(s => s.h > m.H); }

  const hourUnit = n => n === 1 ? 'ساعة' : n === 2 ? 'ساعتان' : (n % 100 >= 3 && n % 100 <= 10) ? 'ساعات' : 'ساعة';
  function counterParts(m) {
    if (m.prep) {
      const h = m.prepH;
      return h < 48 ? { lbl: 'يوم إقلاعك بعد', big: nf(Math.max(1, Math.floor(h))), unit: hourUnit(Math.max(1, Math.floor(h))) } : { lbl: 'يوم إقلاعك بعد', big: nf(Math.floor(h / 24)), unit: dayUnit(Math.floor(h / 24)) };
    }
    const lbl = m.gradual && !m.free ? 'في خطة التدرّج منذ' : 'نقيّ منذ';
    if (!m.gradual && m.H < 72) return { lbl, big: nf(Math.floor(m.H)), unit: hourUnit(Math.floor(m.H)) };
    return { lbl, big: nf(m.days), unit: dayUnit(m.days) };
  }

  RENDER.today = function () {
    const m = metrics();
    const ns = nextStop(m);
    const cur = state.currency;
    const cp = counterParts(m);
    const scope = taskScope(m);
    const tasks = todayTasks(m);
    const doneN = tasks.filter(t => isTaskDone(scope, t)).length;
    const nxt = nextTask(tasks, scope);
    const alert = relapseAlert(m);

    let html = `
      <header class="topbar">
        <div class="brand">
          <div class="logo">${ic('leaf')}</div>
          <div>
            <p class="eyebrow">${fmtDate(m.now, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
            <h1 class="h2">${greeting()}</h1>
          </div>
        </div>
        <button class="icon-btn" data-action="settings" aria-label="الإعدادات">${ic('settings', 'sm')}</button>
      </header>

      <section class="card hero">
        <div class="scene compact" id="scene">${sceneSVG(m, { align: 'xMidYMax' })}
          <span class="chip glass-chip scene-badge">${m.prep ? ic('calendar', 'xs') + ' مرحلة التحضير' : m.free ? ic('crown', 'xs') + ' وضع الحرية' : 'اليوم ' + ar(m.day) + ' من ٣٠'}</span>
          <div id="float-words" aria-hidden="true"></div>
        </div>
        <div class="hero-body">
          <div class="row between" style="align-items:flex-end">
            <div>
              <p class="xs muted" style="margin:0 0 2px" data-live="lbl">${cp.lbl}</p>
              <div class="counter"><span class="big num" data-live="big">${cp.big}</span><span class="h3 ink2" data-live="unit">${cp.unit}</span></div>
            </div>
            <div style="text-align:left">
              <div class="clock num" data-live="clock"></div>
              <div class="xs muted" data-live="next">${!m.prep && ns ? esc(ns.t) + ' بعد ' + fmtDur(ns.h - m.H) : ''}</div>
            </div>
          </div>
          ${m.prep ? '' : `<div class="bar thin" style="margin-top:12px"><i data-live="prog" style="width:${Math.max(2, clamp(m.pd / 30 * 100, 0, 100))}%"></i></div>`}
        </div>
      </section>`;

    if (alert) html += alertCard(alert);

    // The plan card: next task + today's steps
    const title = m.prep ? 'خطة التحضير' : m.free ? 'خطتك اليوم' : 'خطتك اليوم · ' + m.chapter.title;
    html += `<section class="card plan">
      <div class="row between"><h2 class="h3">${title}</h2><span class="chip ${doneN === tasks.length ? 'sage' : ''} num">${ar(doneN)} من ${ar(tasks.length)}</span></div>
      <div class="bar thin" style="margin:10px 0 14px"><i style="width:${doneN / tasks.length * 100}%"></i></div>`;
    if (nxt) {
      html += `<div class="next-task">
        <div class="xs sage bold">${ic('play', 'xs')} مهمتك التالية · ${nxt.when || 'الآن'}</div>
        <p class="h3" style="margin:6px 0 12px;line-height:1.7">${nxt.t}</p>
        <button class="btn primary block" data-action="taskGo" data-id="${nxt.id}">${nxt.act ? nxt.btn : ic('check', 'sm') + ' تم'}</button>
      </div>`;
    } else {
      html += `<div class="next-task center">
        <span class="ibox" style="margin:0 auto 8px;width:48px;height:48px;border-radius:16px">${ic('circle-check', 'lg')}</span>
        <p class="h3" style="margin:0">${m.prep ? 'جاهز ليوم إقلاعك' : 'أكملت خطة اليوم'}</p>
        <p class="small muted" style="margin:4px 0 0">${m.prep ? 'تبدأ رحلتك في ' + fmtDate(m.st, { weekday: 'long', hour: 'numeric', minute: '2-digit' }) : QUOTES[Math.floor(m.now / 864e5) % QUOTES.length]}</p>
      </div>`;
    }
    html += (nxt ? `<p class="xs muted" style="margin:4px 0 0">بقية خطتك</p>` : '') + `<div class="tasks">` + tasks.filter(t => t !== nxt).map(t => {
      const dn = isTaskDone(scope, t);
      return `<button class="task" data-action="taskRow" data-id="${t.id}" aria-pressed="${dn}">
        <span class="tick-box">${dn ? ic('check', 'xs') : ''}</span>
        <span class="grow"><span class="xs muted row" style="gap:4px">${ic(t.icon, 'xs')} ${t.when || ''}</span><span class="small t">${t.t}</span></span>
        ${t.act && !dn ? ic('chevron-left', 'sm muted') : ''}
      </button>`;
    }).join('') + `</div>`;
    if (m.prep) {
      html += `<button class="btn ghost block sm" style="margin-top:6px" data-action="quitNow">${ic('zap', 'xs')} أنا جاهز — ابدأ الآن</button>`;
    } else if (!m.free) {
      html += `<div class="row between" style="margin-top:10px">
        <button class="btn ghost sm" data-action="openDay" data-day="${m.day}">${ic('book-open', 'xs')} عن اليوم ${ar(m.day)}</button>
        ${m.day < 30 ? `<span class="xs muted clamp-2" style="max-width:55%;text-align:left">غداً: ${planTasks(m.day + 1)[0].t}</span>` : ''}
      </div>`;
    }
    html += `</section>`;

    // Taper allowance (gradual)
    if (m.gradual && !m.free && !m.prep) {
      const over = Math.max(0, m.usedToday - m.allowed);
      const dots = Array.from({ length: Math.max(m.allowed, m.usedToday) }, (_, i) => `<span class="pouch ${i < m.usedToday ? (i >= m.allowed ? 'over' : 'used') : ''}"></span>`).join('');
      html += `
      <section class="card tight">
        <div class="row">
          <span class="ibox sm sand">${ic('trending-down', 'sm')}</span>
          <div class="grow">
            <div class="small bold">${m.allowed ? 'حصة اليوم: ' + nf(m.usedToday) + ' من ' + nf(m.allowed) : 'يوم صفر — لا أظرف اليوم'}</div>
            ${dots ? `<div class="pouches" style="margin-top:6px">${dots}</div>` : ''}
          </div>
          <button class="btn sm soft-sand" data-action="taperAdd">${ic('plus', 'xs')} ظرف</button>
          <button class="icon-btn sm" data-action="taperUndo" ${m.usedToday ? '' : 'disabled'} aria-label="تراجع">${ic('rotate-ccw', 'xs')}</button>
        </div>
        ${over ? '<p class="xs rose" style="margin:8px 0 0">تجاوزت الحصة بـ' + nf(over) + ' — لا بأس، سجّلها بصدق وغداً بداية جديدة.</p>' : ''}
      </section>`;
    }

    if (!m.prep) html += `
      <button class="card tight strip" data-action="tab" data-tab="insights" aria-label="تفاصيل التوفير والمكافأة">
        <div><div class="v num"><span data-live="saved">${nf(m.saved, 0)}</span> <small>${esc(cur)}</small></div><div class="l">وفّرت</div></div>
        <div><div class="v num" data-live="avoided">${nf(Math.floor(m.avoided))}</div><div class="l">ظرف تجنّبته</div></div>
        <div><div class="v num" data-live="goalPct">${nf(Math.floor(m.goalPct))}٪</div><div class="l">نحو مكافأتك</div></div>
      </button>`;

    $('#view-today').innerHTML = html;
    lastDay = m.day; lastPrep = m.prep;
    updateLive(m);
    startWords();
  };
  const dayUnit = n => n === 1 ? 'يوم' : n === 2 ? 'يومان' : (n % 100 >= 3 && n % 100 <= 10) ? 'أيام' : 'يوماً';
  const afterIdx = m => clamp(Math.floor((m.pd - 30) / 7), 0, AFTER30.length - 1);

  let checkinEditing = false;
  let checkinDraft = {};

  /* =========================================================
     VIEW: JOURNEY
     ========================================================= */
  let openChapter = null;
  RENDER.journey = function () {
    const m = metrics();
    let html = `
      <header class="topbar"><div><p class="eyebrow">${m.prep ? 'مرحلة التحضير' : m.free ? 'أتممت الثلاثين — الشجرة مكتملة' : 'اليوم ' + ar(m.day) + ' من ٣٠'}</p><h1 class="h1">رحلتك</h1></div>
        <span class="chip sand">${ic('award', 'xs')} ${nf(BADGES.filter(b => b.ok(m)).length)}/${nf(BADGES.length)} وسام</span></header>
      <div class="seg" role="tablist">
        <button data-action="journeySeg" data-v="path" aria-pressed="${journeySeg === 'path'}">الخطة</button>
        <button data-action="journeySeg" data-v="body" aria-pressed="${journeySeg === 'body'}">جسدك</button>
        <button data-action="journeySeg" data-v="badges" aria-pressed="${journeySeg === 'badges'}">الأوسمة</button>
      </div>`;

    if (journeySeg === 'path') {
      if (m.free) html += freedomCard(m);
      if (m.prep) html += `<section class="card" style="border-color:var(--sage)"><div class="row"><span class="ibox">${ic('calendar')}</span><div class="grow"><div class="xs sage bold">أنت هنا</div><h2 class="h3">التحضير</h2><p class="xs muted" style="margin:0">يوم إقلاعك ${fmtDate(m.st, { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' })}</p></div></div></section>`;
      if (openChapter === null) openChapter = m.free ? 0 : m.chapter.n;
      CHAPTERS.forEach((c, ci) => {
        const days = DAYS.filter(d => d.day >= c.from && d.day <= c.to);
        const isDone = d => (!m.prep && d.day < m.day) || m.free;
        const doneN = days.filter(isDone).length;
        const isCur = !m.prep && !m.free && m.chapter.n === c.n;
        const allDone = doneN === days.length;
        const open = openChapter === c.n;
        const goal = m.gradual ? WEEK_GOALS[ci].g(allowance(c.from)) : WEEK_GOALS[ci].c;
        html += `<section class="card" ${isCur ? 'style="border-color:var(--sage)"' : ''}>
          <button class="chapter-head" style="width:100%;text-align:right" data-action="toggleChapter" data-n="${c.n}" aria-expanded="${open}">
            <span class="ibox ${allDone || isCur ? '' : 'sand'}">${ic(allDone ? 'circle-check' : c.icon)}</span>
            <div class="grow"><div class="xs ${isCur ? 'sage' : 'muted'} bold">الأسبوع ${ar(c.n)} · الأيام ${ar(c.from)}–${ar(c.to)}${isCur ? ' · أنت هنا' : allDone ? ' · مكتمل' : ''}</div>
              <h2 class="h3">${c.title}</h2>
              <p class="xs ink2" style="margin:2px 0 0">${ic('target', 'xs')} الهدف: ${goal}</p></div>
            <span class="muted" style="transition:transform .25s;${open ? 'transform:rotate(180deg)' : ''}">${ic('chevron-down', 'sm')}</span>
          </button>
          <div class="day-dots">${days.map(d => `<button class="dd ${isDone(d) ? 'done' : ''} ${!m.prep && !m.free && d.day === m.day ? 'cur' : ''} ${d.ms ? 'ms' : ''}" data-action="openDay" data-day="${d.day}" aria-label="اليوم ${ar(d.day)}">${ar(d.day)}</button>`).join('')}</div>`;
        if (open) {
          html += `<div class="col" style="gap:0;margin-top:8px">` + days.map(d => {
            const dc = dayContent(d.day, m.gradual), cur = !m.prep && !m.free && d.day === m.day;
            return `<button class="day-row ${cur ? 'cur' : ''}" data-action="openDay" data-day="${d.day}">
              <span class="num xs bold ${isDone(d) ? 'sage' : cur ? 'sand' : 'muted'}" style="width:28px">${ar(d.day)}</span>
              <span class="grow"><span class="small bold">${d.t}</span>${d.ms ? ` <span class="xs sand">· ${d.ms}</span>` : ''}<span class="xs muted clamp-2" style="display:block">${dc.act}</span></span>
              ${isDone(d) ? ic(state.completedChallenges[d.day] ? 'circle-check' : 'check', 'sm sage') : cur ? '<span class="chip sage">اليوم</span>' : ''}
            </button>`;
          }).join('') + `</div>`;
        }
        html += `</section>`;
      });
      if (!m.free) html += freedomCard(m);
    } else if (journeySeg === 'body') {
      const hx = m.cleanH;
      const nextI = BODY.findIndex(b => b.h > hx);
      html += supportCallout();
      if (m.gradual && hx <= 0) html += `<div class="callout sand small" style="line-height:1.8">${ic('info', 'xs')} في مسار التدرّج تبدأ ساعات التعافي الكاملة من <b>يوم الصفر (اليوم ٢٨)</b>. حتى ذلك الحين، كل ظرف تخفّضه يعني نيكوتيناً أقل في دمك.</div>`;
      html += `<section class="card"><div class="card-head"><span class="ibox">${ic('activity')}</span><div class="grow"><h2 class="h3">ماذا يحدث في جسدك؟</h2><p class="xs muted" style="margin:0">خط زمني يتحدّث تلقائياً مع كل ساعة بلا نيكوتين</p></div></div>
        <div class="timeline">` + BODY.map((b, i) => {
          const done = hx >= b.h, next = i === nextI && hx > 0;
          const prevH = i ? BODY[i - 1].h : 0;
          const pct = done ? 100 : next ? clamp((hx - prevH) / (b.h - prevH) * 100, 2, 100) : 0;
          return `<div class="tl-item ${done ? 'done' : next ? 'next' : ''}">
            <div class="tl-dot">${ic(done ? 'check' : b.icon, 'sm')}</div>
            <div style="padding-bottom:8px;border-bottom:1px solid var(--line)">
              <div class="row between"><span class="h3">${b.t}</span><span class="xs ${done ? 'sage' : next ? 'sand' : 'muted'} bold">${done ? 'تحقّق' : next ? 'بعد ' + fmtDur(b.h - hx) : 'عند ' + fmtDur(b.h)}</span></div>
              <p class="small ink2" style="margin:2px 0 ${next ? '8px' : '0'};line-height:1.75">${b.d}</p>
              ${next ? `<div class="bar thin"><i style="width:${pct}%"></i></div>` : ''}
            </div></div>`;
        }).join('') + `</div>
        <p class="xs muted" style="margin:14px 0 0">${ic('info', 'xs')} الأزمنة تقريبية وتختلف بين الأشخاص. نَقَاء أداة دعم وليس بديلاً عن استشارة الطبيب.</p></section>`;
    } else {
      const earned = BADGES.filter(b => b.ok(m)).length;
      html += `<section class="card tight"><div class="row"><span class="ibox sand">${ic('award')}</span><div class="grow"><div class="h3">${nf(earned)} من ${nf(BADGES.length)} وسام</div><div class="bar thin" style="margin-top:8px"><i style="width:${earned / BADGES.length * 100}%"></i></div></div></div></section>
      <div class="badge-grid">` + BADGES.map(b => {
        const on = b.ok(m);
        return `<button class="badge ${on ? 'on' : ''} ${b.sage ? 'sage-m' : ''}" data-action="openBadge" data-id="${b.id}">
          <span class="medal">${ic(b.icon, 'lg')}${on ? '' : `<span class="lk">${ic('lock', 'xs')}</span>`}</span>
          <span class="nm">${b.t}</span></button>`;
      }).join('') + `</div>`;
    }
    $('#view-journey').innerHTML = html;
  };

  function freedomCard(m) {
    if (!m.free) {
      return `<section class="card"><div class="row"><span class="ibox sand">${ic('crown')}</span><div class="grow"><h2 class="h3">بعد الثلاثين: خطة الحماية</h2><p class="xs muted" style="margin:0">خطر الانتكاس يبقى قائماً قرابة ٣ أشهر، لذا تُفتح بعد اليوم ٣٠ خطة أسبوعية من ${nf(AFTER30.length)} أسابيع لحماية إنجازك.</p></div></div></section>`;
    }
    const cur = afterIdx(m);
    return `<section class="card" style="border-color:var(--sand)">
      <div class="card-head"><span class="ibox sand">${ic('crown')}</span><div class="grow"><h2 class="h3">خطة الحماية · الأسبوع ${ar(cur + 5)}</h2><p class="xs muted" style="margin:0">حرّ منذ ${daysW(Math.max(1, m.days))}. هذه الأسابيع تثبّت ما بنيته.</p></div></div>
      <div class="col" style="gap:8px">${AFTER30.map((a, i) => `<div class="callout ${i === cur ? 'sand' : ''}" style="padding:10px 12px;${i > cur ? 'opacity:.55' : ''}">
        <div class="row"><span class="xs bold num ${i === cur ? 'sand' : 'muted'}" style="width:52px">أسبوع ${ar(i + 5)}</span><div class="grow small"><b>${a.t}</b>${i <= cur ? `<div class="xs ink2" style="line-height:1.7">${a.d}</div>` : ''}</div>${state.completedChallenges['w' + i] ? ic('circle-check', 'sm sage') : ''}</div></div>`).join('')}</div>
    </section>`;
  }

  function supportCallout() {
    return `<button class="card tight row" style="width:100%;text-align:right;background:var(--sage-soft);border-color:transparent" data-action="support">
      <span class="ibox">${ic('hand-heart')}</span>
      <div class="grow"><div class="h3">لست مضطراً للاعتماد على الإرادة وحدها</div><div class="xs ink2">بدائل النيكوتين الطبية والصيدلي — اعرف خياراتك</div></div>
      ${ic('chevron-left', 'sm')}</button>`;
  }
  function openSupport() {
    openSheet(`
      <div class="row"><span class="ibox">${ic('hand-heart')}</span><h2 class="h2 grow">دعم إضافي آمن</h2></div>

          ['heart-pulse', 'أخبر الطبيب قبل أي علاج إن كانت لديك حالة قلبية، أو كنتِ حاملاً أو مرضعاً.'],

          ['circle-alert', 'إن شعرت بحزن شديد أو أفكار مقلقة أثناء الإقلاع، تواصل مع مختص أو طبيب فوراً.']

      <button class="btn primary block" data-action="closeSheet">فهمت</button>`);

  /* =========================================================
     VIEW: SOS
     ========================================================= */
  RENDER.sos = function () {
    const m = metrics();
    const last = state.cravings.slice().sort((a, b) => b.ts - a.ts)[0];
    $('#view-sos').innerHTML = `
      <header class="topbar"><div><p class="eyebrow">الرغبة تبلغ ذروتها ثم تنحسر خلال دقائق</p><h1 class="h1">نجدة</h1></div></header>
      <section class="card sos-hero">
        <h2 class="h2">هل تشعر برغبة الآن؟</h2>
        <p class="small muted" style="margin:6px auto 0;max-width:300px">لا تقاومها وحدك. ثلاث دقائق من التنفّس والتركيز، وسترى الموجة تنكسر أمامك.</p>
        <button class="sos-orb" data-action="sessionStart" aria-label="ابدأ جلسة العبور لمدة ٣ دقائق">
          ${ic('wind', 'xl')}<span class="h3">ابدأ ٣ دقائق</span><span class="xs ink2">جلسة العبور</span>
        </button>
        <div class="row wrap" style="justify-content:center;gap:8px">
          <span class="chip sage">${ic('waves', 'xs')} ${m.won ? 'عبرت ' + wavesW(m.won) : 'لم تسجّل موجات بعد'}</span>
          ${last ? `<span class="chip">${ic('clock', 'xs')} آخر رغبة قبل ${fmtDur((m.now - last.ts) / 36e5)}</span>` : ''}
        </div>
      </section>

      <section class="card">
        <div class="card-head"><span class="ibox">${ic('hand-heart')}</span><div class="grow"><h2 class="h3">بدائل فورية للفم واليد</h2><p class="xs muted" style="margin:0">اختر واحداً وطبّقه الآن</p></div></div>
        <div class="grid-4">${ALTS.map((a, i) => `<button class="opt" data-action="alt" data-idx="${i}" aria-pressed="false">${ic(a.icon)}<span>${a.t}</span></button>`).join('')}</div>
        <div id="alt-box" class="callout sage small" style="margin-top:12px;line-height:1.8" hidden></div>
      </section>

      <button class="btn block" data-action="logCraving">${ic('pen-line', 'sm')} سجّل رغبة مرّت بك دون جلسة</button>`;
  };

  /* =========================================================
     VIEW: INSIGHTS
     ========================================================= */
  const BUCKETS = ['١٢ص', '٣ص', '٦ص', '٩ص', '١٢م', '٣م', '٦م', '٩م'];
  const BUCKET_LONG = ['منتصف الليل–٣ فجراً', '٣–٦ فجراً', '٦–٩ صباحاً', '٩–١٢ ظهراً', '١٢–٣ عصراً', '٣–٦ مساءً', '٦–٩ مساءً', '٩–١٢ ليلاً'];
  RENDER.insights = function () {
    const m = metrics();
    const cr = state.cravings;
    const total = cr.length;
    const cur = esc(state.currency);
    let html = `<header class="topbar"><div><p class="eyebrow">مكاسبك وأنماطك في مكان واحد</p><h1 class="h1">رؤى</h1></div></header>`;

    const rate = (m.won + m.slipped) ? Math.round(m.won / (m.won + m.slipped) * 100) : null;
    const buckets = Array(8).fill(0);
    cr.forEach(c => { buckets[Math.floor(new Date(c.ts).getHours() / 3)]++; });
    const maxB = Math.max(...buckets);
    const peakI = maxB ? buckets.indexOf(maxB) : -1;
    const dayLeft = m.perDay > 0 ? Math.ceil(Math.max(0, state.goalPrice - m.saved) / m.perDay) : 0;

    html += `<section class="grid-2">
      <div class="stat"><span class="l">وفّرت</span><div class="v num">${nf(m.saved, m.saved < 100 ? 1 : 0)}<small>${cur}</small></div></div>
      <div class="stat"><span class="l">ظرف تجنّبته</span><div class="v num">${nf(Math.floor(m.avoided))}</div></div>
      <div class="stat"><span class="l">نيكوتين لم يدخل جسدك</span><div class="v num">${nf(Math.round(m.mg))}<small>ملغ</small></div></div>
      <div class="stat"><span class="l">موجات عبرتها</span><div class="v num">${nf(m.won)}</div></div>
    </section>

    <section class="card">
      <div class="card-head">
        <span class="ibox sand">${ic('gift')}</span>
        <div class="grow"><p class="xs muted" style="margin:0">مكافأتك</p><h2 class="h3">${esc(state.goalName)}</h2></div>
        <button class="btn sm" data-action="editGoal">${ic('pencil', 'xs')} تعديل</button>
      </div>
      <div class="row between small" style="margin-bottom:8px"><span><b class="num">${nf(Math.min(m.saved, state.goalPrice), 0)}</b> <span class="muted">من ${nf(state.goalPrice)} ${cur}</span></span><b class="num sand">${nf(Math.floor(m.goalPct))}٪</b></div>
      <div class="bar"><i style="width:${Math.max(2, m.goalPct)}%"></i></div>
      <p class="xs muted" style="margin:10px 0 0">${m.goalPct >= 100 ? 'مبارك! جمعت قيمة مكافأتك كاملة — اشترِها بفخر.' : 'توفّر ' + nf(m.perDay, 1) + ' ' + cur + ' يومياً · تصل إليها تقريباً في ' + fmtDate(m.now + dayLeft * 864e5)}</p>
    </section>`;

    if (!total) {
      html += `<section class="card empty"><span class="ibox">${ic('chart-column', 'lg')}</span><h2 class="h3">لا رغبات مسجّلة بعد</h2>
        <p class="small muted" style="margin:6px 0 14px">بعد كل جلسة «نجدة» أو رغبة تمر بك، سجّلها في ثوانٍ. سيظهر لك هنا متى تأتيك الرغبة وما الذي يثيرها.</p>
        <button class="btn soft" data-action="logCraving">${ic('pen-line', 'sm')} سجّل أول رغبة</button></section>`;
    } else {
      html += `<section class="card">
        <div class="card-head"><span class="ibox">${ic('clock')}</span><div class="grow"><h2 class="h3">متى تأتيك الرغبة؟</h2><p class="xs muted" style="margin:0">${nf(total)} رغبة مسجّلة${rate != null ? ' · نسبة العبور ' + nf(rate) + '٪' : ''}</p></div></div>
        <div class="bars" role="img" aria-label="توزيع الرغبات على ساعات اليوم">
          ${buckets.map((v, i) => `<div class="bar-col" data-tip="${BUCKET_LONG[i]}: ${v ? nf(v) + ' رغبة' : 'لا شيء'}">
            <div class="bar-track">${i === peakI ? `<span class="bar-val num" style="bottom:${v / maxB * 100}%">${nf(v)}</span>` : ''}<div class="bar-fill ${i === peakI ? 'peak' : ''}" style="height:${maxB ? v / maxB * 100 : 0}%"></div></div>
            <span class="bar-lbl">${BUCKETS[i]}</span></div>`).join('')}
        </div>
        ${peakI >= 0 ? `<div class="callout small" style="margin-top:12px;line-height:1.8">${ic('lightbulb', 'xs')} ذروة رغباتك بين <b>${BUCKET_LONG[peakI]}</b>. جهّز خطة في «درع المواقف» لهذا الوقت.</div>` : ''}
      </section>`;

      const tc = {};
      cr.forEach(c => { tc[c.trigger] = (tc[c.trigger] || 0) + 1; });
      const top = Object.entries(tc).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const tmax = top.length ? top[0][1] : 1;
      html += `<section class="card">
        <div class="card-head"><span class="ibox">${ic('target')}</span><div class="grow"><h2 class="h3">أكثر ما يثير رغبتك</h2></div></div>
        <div class="col" style="gap:12px">${top.map(([id, n]) => { const t = TRIGGERS.find(x => x.id === id) || TRIGGERS[8]; return `<div class="hbar" data-tip="${t.t}: ${nf(n)} رغبة"><span class="row" style="gap:6px">${ic(t.icon, 'xs')}${t.t}</span><span class="track"><i style="width:${n / tmax * 100}%"></i></span><b class="num xs">${nf(n)}</b></div>`; }).join('')}</div>
      </section>`;
    }

    // Mood trend
    const days14 = Array.from({ length: 14 }, (_, i) => { const d = new Date(); d.setDate(d.getDate() - (13 - i)); return { k: dateKey(d), d }; });
    const pts = days14.map((x, i) => ({ i, c: state.checkins[x.k], d: x.d })).filter(p => p.c);
    if (pts.length) {
      const W = 320, H = 130, padX = 14, padY = 16;
      const xOf = i => W - padX - i * ((W - padX * 2) / 13); // RTL: oldest on the right
      const yOf = v => padY + (5 - v) * ((H - padY * 2) / 4);
      let path = '', prev = null;
      pts.forEach(p => { const x = xOf(p.i), y = yOf(p.c.mood); path += (prev && p.i === prev.i + 1 ? 'L' : 'M') + x.toFixed(1) + ',' + y.toFixed(1) + ' '; prev = p; });
      const avg = pts.reduce((a, p) => a + p.c.mood, 0) / pts.length;
      const avgMood = MOODS[Math.round(avg) - 1];
      html += `<section class="card">
        <div class="card-head"><span class="ibox">${ic('smile')}</span><div class="grow"><h2 class="h3">مزاجك في آخر ١٤ يوماً</h2><p class="xs muted" style="margin:0">المتوسط: ${avgMood.t} · ${nf(pts.length)} تسجيل</p></div></div>
        <svg class="chart-svg" viewBox="0 0 ${W} ${H}" role="img" aria-label="منحنى المزاج اليومي">
          ${[1, 3, 5].map(v => `<line x1="${padX}" x2="${W - padX}" y1="${yOf(v)}" y2="${yOf(v)}" stroke="var(--line)" stroke-width="1"/>`).join('')}
          <path d="${path}" fill="none" stroke="var(--sage)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
          ${pts.map(p => `<circle cx="${xOf(p.i).toFixed(1)}" cy="${yOf(p.c.mood).toFixed(1)}" r="5" fill="var(--sage)" stroke="var(--surface)" stroke-width="2" data-tip="${fmtDate(p.d.getTime())}: ${MOODS[p.c.mood - 1].t} · رغبة ${CRAVE_LEVELS[p.c.craving]}"/><circle cx="${xOf(p.i).toFixed(1)}" cy="${yOf(p.c.mood).toFixed(1)}" r="14" fill="transparent" data-tip="${fmtDate(p.d.getTime())}: ${MOODS[p.c.mood - 1].t} · رغبة ${CRAVE_LEVELS[p.c.craving]}"/>`).join('')}
        </svg>
        <div class="row between xs muted" style="margin-top:6px"><span>قبل ١٤ يوماً</span><span>الأعلى = مزاج أفضل</span><span>اليوم</span></div>
      </section>`;
    }

    // Shields
    html += `<section class="card">
      <div class="card-head"><span class="ibox">${ic('shield')}</span><div class="grow"><h2 class="h3">درع المواقف</h2><p class="xs muted" style="margin:0">خطط «إذا… فسأ…» جاهزة قبل أن تأتي الرغبة</p></div>
        <button class="icon-btn sm" data-action="shieldEdit" data-idx="-1" aria-label="إضافة خطة">${ic('plus', 'sm')}</button></div>
      <div class="col">` + (state.shields.length ? state.shields.map((s, i) => `
        <div class="callout" style="padding:12px 14px">
          <div class="row" style="align-items:flex-start">
            <div class="grow small" style="line-height:1.9"><span class="muted">إذا</span> <b>${esc(s.when)}</b><br><span class="muted">فسأ</span> <span class="sage bold">${esc(s.then)}</span></div>
            <button class="icon-btn sm" data-action="shieldEdit" data-idx="${i}" aria-label="تعديل">${ic('pencil', 'xs')}</button>
            <button class="icon-btn sm" data-action="shieldDel" data-idx="${i}" aria-label="حذف">${ic('trash-2', 'xs')}</button>
          </div></div>`).join('') : `<p class="small muted" style="margin:0">لا خطط بعد. أضف خطتك الأولى لأخطر موقف عليك.</p>
          <div class="row wrap">${['شربت قهوتي الصباحية', 'ركبت السيارة', 'شعرت بضغط العمل'].map(w => `<button class="chip" data-action="shieldQuick" data-w="${w}">${ic('plus', 'xs')} ${w}</button>`).join('')}</div>`) + `</div>
    </section>`;

    // Recent log + lessons
    const recent = cr.slice().sort((a, b) => b.ts - a.ts).slice(0, 6);
    if (recent.length) {
      html += `<section class="card"><div class="card-head"><span class="ibox sand">${ic('list-checks')}</span><h2 class="h3 grow">آخر الموجات</h2></div><div class="col" style="gap:0">` +
        recent.map(c => { const t = TRIGGERS.find(x => x.id === c.trigger) || TRIGGERS[8]; return `<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line)">
          <span class="ibox sm ${c.outcome === 'won' ? '' : 'rose'}">${ic(c.outcome === 'won' ? 'shield-check' : 'rotate-ccw', 'xs')}</span>
          <div class="grow"><div class="small bold">${t.t} <span class="xs muted">· ${INTENSITY[c.intensity] || ''}</span></div>${c.note ? `<div class="xs muted">${esc(c.note)}</div>` : ''}</div>
          <span class="xs muted">${fmtDate(c.ts, { day: 'numeric', month: 'short' })} ${fmtTime(c.ts)}</span></div>`; }).join('') + `</div></section>`;
    }
    const lessons = state.slips.filter(s => s.lesson).slice().reverse().slice(0, 5);
    if (lessons.length) {
      html += `<section class="card"><div class="card-head"><span class="ibox rose">${ic('book-open')}</span><div class="grow"><h2 class="h3">دروس التعثّر</h2><p class="xs muted" style="margin:0">كل تعثّر علّمك شيئاً</p></div></div>
        <div class="col">${lessons.map(s => `<div class="callout small" style="line-height:1.8"><span class="xs muted">${fmtDate(s.ts)}</span><br>${esc(s.lesson)}</div>`).join('')}</div></section>`;
    }
    $('#view-insights').innerHTML = html;
  };

  /* =========================================================
     VIEW: ME
     ========================================================= */
  RENDER.me = function () {

    const initial = (state.name || 'ن').trim().charAt(0);
    const row = (action, icon, t, s, tone = '') => `<button class="list-row" data-action="${action}"><span class="ibox sm ${tone}">${ic(icon, 'sm')}</span><div class="grow"><div class="t">${t}</div>${s ? `<div class="s">${s}</div>` : ''}</div>${ic('chevron-left', 'sm')}</button>`;
    $('#view-me').innerHTML = `

      <section class="card">

      <p class="group-title">خطتي</p>
      <div class="list">
        ${row('editPlan', 'sliders-horizontal', 'تعديل خطتي', 'أسلوب الإقلاع، الاستهلاك، تاريخ البداية')}
        ${row('support', 'hand-heart', 'دعم إضافي آمن', 'بدائل النيكوتين الطبية والصيدلي')}
        ${row('share', 'share-2', 'شارك بطاقة إنجازك', 'صورة بشجرتك وأرقامك', 'sand')}
      </div>
      <p class="xs muted center" style="margin:6px 0 0">نَقَاء · الإصدار ٣٫٠</p>`;
  };

      </div>
      <p class="group-title">بداية جديدة</p>
      <div class="list" style="box-shadow:none">
        <button class="list-row" data-action="resetCounter"><span class="ibox sm rose">${ic('rotate-ccw', 'sm')}</span><div class="grow"><div class="t">إعادة ضبط العدّاد</div><div class="s">تحفظ أطول فترة ودروسك وإعداداتك</div></div></button>

  let lastDay = null, lastPrep = null;
  function updateLive(m) {
    if (currentTab !== 'today') return;
    const set = (k, v) => { const el = $(`[data-live="${k}"]`); if (el && el.textContent !== v) el.textContent = v; };
    const cp = counterParts(m); set('big', cp.big); set('unit', cp.unit); set('lbl', cp.lbl);
    const c = $('[data-live="clock"]');
    if (c) {
      const secs = m.prep ? Math.floor((m.st - m.now) / 1000) : Math.floor(m.ms / 1000);
      const H2 = Math.floor(secs / 3600) % 24, M2 = Math.floor(secs / 60) % 60, S2 = secs % 60;
      const hoursMode = m.prep ? m.prepH < 48 : (!m.gradual && m.H < 72);
      c.innerHTML = (hoursMode ? '' : `<b>${ar(pad2(H2))}</b> س : `) + `<b>${ar(pad2(M2))}</b> د : <b>${ar(pad2(S2))}</b> ث`;
    }
    const pr = $('[data-live="prog"]'); if (pr) pr.style.width = Math.max(2, clamp(m.pd / 30 * 100, 0, 100)) + '%';
    const ns = nextStop(m);
    set('next', !m.prep && ns ? ns.t + ' بعد ' + fmtDur(ns.h - m.H) : '');
    set('saved', nf(m.saved, 0));
    set('avoided', nf(Math.floor(m.avoided)));
    set('goalPct', nf(Math.floor(m.goalPct)) + '٪');
  }
