  /* =========================================================
     FIREBASE (REST)
     ========================================================= */
  async function fbAuth(apiKey, email, password) {
    const call = async ep => {
      const r = await fetch(`https://identitytoolkit.googleapis.com/v1/accounts:${ep}?key=${encodeURIComponent(apiKey)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password, returnSecureToken: true }) });
      return { ok: r.ok, data: await r.json() };
    };
    let r = await call('signInWithPassword');
    if (!r.ok) r = await call('signUp');
    if (!r.ok) throw new Error((r.data && r.data.error && r.data.error.message) || 'تعذرت المصادقة');
    return { uid: r.data.localId, idToken: r.data.idToken, refreshToken: r.data.refreshToken };
  }
  async function fbRefresh() {
    const c = state.firebaseConfig;
    if (!c.apiKey || !c.refreshToken) return false;
    const r = await fetch(`https://securetoken.googleapis.com/v1/token?key=${encodeURIComponent(c.apiKey)}`, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(c.refreshToken) });
    if (!r.ok) return false;
    const d = await r.json();
    c.idToken = d.id_token; c.refreshToken = d.refresh_token; save(false);
    return true;
  }
  function fbEndpoint() {
    const c = state.firebaseConfig;
    return `${c.databaseURL.replace(/\/$/, '')}/users/${encodeURIComponent(c.uid)}/naqaState.json${c.idToken ? '?auth=' + encodeURIComponent(c.idToken) : ''}`;
  }
  async function fbFetch(opts, retry = true) {
    const r = await fetch(fbEndpoint(), opts);
    if ((r.status === 401 || r.status === 403) && retry && await fbRefresh()) return fbFetch(opts, false);
    return r;
  }
  async function cloudPush() {
    const c = state.firebaseConfig;
    if (!c.databaseURL || !c.uid) return;
    const payload = Object.assign({}, state); delete payload.firebaseConfig;
    const r = await fbFetch({ method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    if (!r.ok) throw new Error('فشل رفع البيانات');
  }
  async function cloudPull() {
    const c = state.firebaseConfig;
    if (!c.databaseURL || !c.uid) throw new Error('اربط حسابك أولاً');
    const r = await fbFetch({});
    if (!r.ok) throw new Error('تعذر جلب البيانات');
    const remote = await r.json();
    if (remote && typeof remote === 'object') {
      const fb = state.firebaseConfig;
      state = normalize(remote.v === 2 ? remote : migrateV1(remote));
      state.firebaseConfig = fb;
      save(false); applyTheme(); rerender();
    }
  }

  /* =========================================================
     SOS SESSION
     ========================================================= */
  const SESSION_LEN = 180;
  const sess = { end: 0, left: SESSION_LEN, paused: false, timer: null, tool: 'breath' };
  const waveF = t => (t / 50) * Math.exp(1 - t / 50); // peaks at 50s
  function sessionStart() {
    sess.left = SESSION_LEN; sess.paused = false; sess.end = Date.now() + SESSION_LEN * 1000;
    $('#session').hidden = false; document.body.style.overflow = 'hidden';
    setSessionTool('breath');
    drawWave(0);
    clearInterval(sess.timer); sess.timer = setInterval(sessionTick, 250);
    sessionTick(); buzz(20);
  }
  function sessionTick() {
    if (!sess.paused) sess.left = Math.max(0, (sess.end - Date.now()) / 1000);
    const s = Math.ceil(sess.left);
    $('#ss-timer').textContent = ar(pad2(Math.floor(s / 60)) + ':' + pad2(s % 60));
    const t = SESSION_LEN - sess.left;
    drawWave(t);
    $('#ss-phase').textContent = t < 35 ? 'الموجة ترتفع — تنفّس معها، لا تقاومها' : t < 70 ? 'أنت عند الذروة — هذا أقصى ما ستصل إليه' : sess.left > 0 ? 'الموجة تنحسر — استمر، أنت تعبرها' : 'عبرت الموجة.';
    if (sess.left <= 0) { clearInterval(sess.timer); sess.timer = null; finishSession(true); }
  }
  function drawWave(t) {
    const W = 320, H = 110, pad = 8;
    const x = s => W - pad - (s / SESSION_LEN) * (W - pad * 2);
    const y = v => H - 14 - v * (H - 34);
    let d = '';
    for (let s = 0; s <= SESSION_LEN; s += 3) d += (s ? 'L' : 'M') + x(s).toFixed(1) + ',' + y(waveF(s)).toFixed(1);
    let dp = '';
    for (let s = 0; s <= t; s += 2) dp += (s ? 'L' : 'M') + x(s).toFixed(1) + ',' + y(waveF(s)).toFixed(1);
    const cx = x(t), cy = y(waveF(t));
    $('#ss-wave').innerHTML = `
      <path d="${d} L${x(SESSION_LEN)},${H - 14} L${x(0)},${H - 14} Z" fill="var(--sage-soft)"/>

      const [label, secs, scale] = p.ph[br.phase];

  /* Calm touch game */
  const gm = { run: false, raf: 0, timer: 0, score: 0, left: 60, orbs: [], fx: [], w: 0, h: 0, ctx: null };
  function gameSetup() {
    const c = $('#gm-canvas'); const r = c.getBoundingClientRect(); const dpr = window.devicePixelRatio || 1;
    c.width = r.width * dpr; c.height = r.height * dpr; gm.w = r.width; gm.h = r.height;
    gm.ctx = c.getContext('2d'); gm.ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function spawnOrb() {
    const r = 18 + Math.random() * 14;
    gm.orbs.push({ x: r + Math.random() * (gm.w - 2 * r), y: gm.h - r - Math.random() * gm.h * .5, r, vy: -(.18 + Math.random() * .35), life: 1, decay: .0035 + Math.random() * .003, gold: Math.random() > .72 });
  }
  function gameStart() {
    gameSetup(); gameStop(false);
    gm.run = true; gm.score = 0; gm.left = 60; gm.orbs = []; gm.fx = [];
    for (let i = 0; i < 3; i++) spawnOrb();
    $('#gm-overlay').hidden = true; $('#gm-score').textContent = '٠'; $('#gm-time').textContent = '٦٠ث';
    const loop = () => {
      if (!gm.run) return;
      const ctx = gm.ctx; ctx.clearRect(0, 0, gm.w, gm.h);
      if (gm.orbs.length < 5 && Math.random() < .06) spawnOrb();
      for (let i = gm.orbs.length - 1; i >= 0; i--) {
        const o = gm.orbs[i]; o.y += o.vy; o.life -= o.decay;
        if (o.life <= .05 || o.y < -o.r) { gm.orbs.splice(i, 1); continue; }
        const g = ctx.createRadialGradient(o.x - o.r * .3, o.y - o.r * .3, 2, o.x, o.y, o.r);
        const c = o.gold ? [235, 211, 170] : [191, 220, 205], c2 = o.gold ? [217, 185, 133] : [111, 165, 140];
        g.addColorStop(0, `rgba(${c},${o.life})`); g.addColorStop(1, `rgba(${c2},${o.life * .25})`);
        ctx.fillStyle = g; ctx.beginPath(); ctx.arc(o.x, o.y, o.r, 0, Math.PI * 2); ctx.fill();
      }
      for (let i = gm.fx.length - 1; i >= 0; i--) {
        const f = gm.fx[i]; f.r += 2.2; f.a -= .045;
        if (f.a <= 0) { gm.fx.splice(i, 1); continue; }
        ctx.strokeStyle = `rgba(${f.gold ? '235,211,170' : '191,220,205'},${f.a})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(f.x, f.y, f.r, 0, Math.PI * 2); ctx.stroke();
      }
      gm.raf = requestAnimationFrame(loop);
    };
    loop();
    gm.timer = setInterval(() => {
      gm.left--; $('#gm-time').textContent = ar(gm.left) + 'ث';
      if (gm.left <= 0) gameStop(true);
    }, 1000);
  }
  function gameStop(finished) {

      body = `<div><h2 class="h1">هذه خطتك</h2><p class="body">${esc(D.name) ? esc(D.name) + '، ' : ''}كل ما عليك هو الخطوة التالية.</p></div>
        <div class="card col" style="gap:0;padding:6px 16px">
          ${prepDays ? `<div class="plan-row"><span class="ibox sm">${ic('calendar', 'sm')}</span><div class="grow"><div class="small bold">التحضير · ${daysW(prepDays)}</div><div class="xs muted">بدائل، شخص داعم، وخطط لمواقفك</div></div></div>` : ''}
          <div class="plan-row"><span class="ibox sm sand">${ic('flag', 'sm')}</span><div class="grow"><div class="small bold">${g ? 'بداية التدرّج' : 'يوم الإقلاع'}</div><div class="xs muted">${st > now ? fmtDate(st, { weekday: 'long', day: 'numeric', month: 'long', hour: 'numeric', minute: '2-digit' }) : 'بدأ — أنت في الخطة الآن'}</div></div></div>
          ${CHAPTERS.map((c, i) => `<div class="plan-row"><span class="num xs bold muted" style="width:32px;text-align:center">أ${ar(c.n)}</span><div class="grow"><div class="small bold">${c.title}</div><div class="xs muted">${g ? WEEK_GOALS[i].g(allowance(c.from, D.dailyPouches)) : WEEK_GOALS[i].c}</div></div></div>`).join('')}
        </div>
        <p class="xs muted" style="margin:0">${prepDays ? 'أول مهامك اليوم:' : 'أول مهامك:'}</p>
        <div class="col" style="gap:6px">${first.map(t => `<div class="callout row small" style="padding:10px 12px;align-items:flex-start;line-height:1.7">${ic(t.icon, 'sm sage')}<span>${t.t}</span></div>`).join('')}</div>`;
      actions = `<button class="btn primary block" data-action="onbFinish">${onb.editing ? 'حفظ الخطة' : 'ابدأ مهمتي الأولى'} ${ic('play', 'sm')}</button>`;
    }
    $('#onb-body').innerHTML = body;
    $('#onb-body').style.animation = 'none'; void $('#onb-body').offsetWidth; $('#onb-body').style.animation = '';
    $('#onb-actions').innerHTML = actions;
    if (name === 'usage') $$('#o-daily,#o-mg,#o-price,#o-per,#o-cur').forEach(el => el.addEventListener('input', () => { readOnbInputs(); $('#o-heavy').innerHTML = heavyNote(D); $('#o-calc').innerHTML = usageCalc(D); }));
    if (name === 'reward') $$('#o-gprice').forEach(el => el.addEventListener('change', () => { readOnbInputs(); renderOnb(); }));
    if (name === 'quit' && $('#o-start')) $('#o-start').addEventListener('change', () => { readOnbInputs(); renderOnb(); });
  }
  function heavyNote(D) {
    if (!(D.dailyPouches >= 15 || D.pouchMg >= 12)) return '';
    return `<div class="callout sand small" style="line-height:1.8">${ic('hand-heart', 'xs')} استهلاكك مرتفع، وقد تفيدك بدائل النيكوتين الطبية مع خطتك. <button class="sand bold" style="text-decoration:underline" data-action="support">اعرف أكثر</button></div>`;
  }
  function finishOnb() {
    readOnbInputs();
    const D = onb.draft;
    const startISO = D.start ? new Date(D.start).toISOString() : new Date().toISOString();
    const startChanged = state.onboarded && startISO !== state.startDateISO;
    if (startChanged && Date.now() > Date.parse(state.startDateISO)) state.history.push({ start: state.startDateISO, end: new Date().toISOString(), hours: metrics().H });
    Object.assign(state, {
      name: D.name, quitMode: D.quitMode, startDateISO: startISO,
      dailyPouches: clamp(D.dailyPouches || 10, 1, 80), pouchMg: clamp(D.pouchMg || 10, 1, 60),
      canPrice: clamp(D.canPrice || 25, 1, 1000), pouchesPerCan: clamp(D.pouchesPerCan || 20, 1, 50), currency: D.currency,
      triggers: D.triggers, reasons: D.reasons, letter: (D.letter || '').trim(),
      goalName: D.goalName || 'مكافأتي', goalPrice: clamp(D.goalPrice || 1000, 10, 1000000)
    });
    if (!state.onboarded || startChanged) { state.celebrated = metrics().day; state.planOffset = 0; }
    const first = !state.onboarded;
    state.onboarded = true;
    if (first) state.badgesSeen = BADGES.filter(b => b.ok(metrics())).map(b => b.id);
    save(); closeOnb(); go('today');
    toast(first ? 'خطتك جاهزة. ابدأ بالمهمة الأولى' : 'حُفظت خطتك', first ? 'list-checks' : 'circle-check');
  }

  /* =========================================================
     SHARE CARD
     ========================================================= */
  async function shareCard() {
    const m = metrics();
    toast('جارٍ تجهيز البطاقة…', 'sparkles');
    try {
      const W = 1080, H = 1350;
      const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
      const ctx = cv.getContext('2d');
      const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#0E1714'); g.addColorStop(1, '#0A0F0D');
      ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
      const svg = sceneSVG(m, { static: true, theme: 'dark' });
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg); });
      const r = 48, sx = 70, sy = 70, sw = W - 140, sh = sw * 240 / 360;
      ctx.save(); ctx.beginPath(); ctx.roundRect ? ctx.roundRect(sx, sy, sw, sh, r) : ctx.rect(sx, sy, sw, sh); ctx.clip(); ctx.drawImage(img, sx, sy, sw, sh); ctx.restore();
      try { await document.fonts.ready; } catch (e) {}
      ctx.direction = 'rtl'; ctx.textAlign = 'center';
      ctx.fillStyle = '#ECE8E1'; ctx.font = '700 140px "Readex Pro", sans-serif';
      ctx.fillText(nf(m.days), W / 2, sy + sh + 190);
      ctx.fillStyle = '#B7C0BB'; ctx.font = '500 46px "Readex Pro", sans-serif';
      ctx.fillText(m.days === 1 ? 'يوم من النقاء' : m.days === 2 ? 'يومان من النقاء' : (m.days % 100 >= 3 && m.days % 100 <= 10 ? 'أيام' : 'يوماً') + ' من النقاء', W / 2, sy + sh + 260);
      const stats = [[nf(m.saved, 0) + ' ' + state.currency, 'وفّرتها'], [nf(Math.floor(m.avoided)), 'ظرف تجنّبته'], [nf(m.won), 'موجة عبرتها']];
      stats.forEach((s, i) => {
        const cx = W - 70 - (sw / 3) * i - sw / 6, y = sy + sh + 400;
        ctx.fillStyle = 'rgba(236,232,225,.06)'; ctx.beginPath(); ctx.roundRect ? ctx.roundRect(cx - sw / 6 + 12, y - 90, sw / 3 - 24, 170, 32) : ctx.rect(cx - sw / 6 + 12, y - 90, sw / 3 - 24, 170); ctx.fill();
        ctx.fillStyle = i === 0 ? '#EBD3AA' : '#BFDCCD'; ctx.font = '700 50px "Readex Pro", sans-serif'; ctx.fillText(s[0], cx, y);
        ctx.fillStyle = '#86918B'; ctx.font = '400 32px "Readex Pro", sans-serif'; ctx.fillText(s[1], cx, y + 52);
      });
      ctx.fillStyle = '#8AB9A3'; ctx.font = '700 54px "Readex Pro", sans-serif'; ctx.fillText('نَقَاء', W / 2, H - 110);
      ctx.fillStyle = '#86918B'; ctx.font = '400 30px "Readex Pro", sans-serif'; ctx.fillText('رحلتي للتحرر من أظرف النيكوتين', W / 2, H - 62);
      const blob = await new Promise(res => cv.toBlob(res, 'image/png'));
      const file = new File([blob], 'naqa-progress.png', { type: 'image/png' });
      if (navigator.canShare && navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'نَقَاء', text: `${nf(m.days)} ${m.days > 10 ? 'يوماً' : 'أيام'} من النقاء` });
      } else {
        const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'naqa-progress.png'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000);
        toast('حُفظت البطاقة على جهازك', 'download');
      }
    } catch (e) { if (e && e.name !== 'AbortError') toast('تعذّر إنشاء البطاقة', 'circle-alert'); }
  }

  /* =========================================================
     ACTIONS
     ========================================================= */
  function runTask(id, primary) {
    const m = metrics(), scope = taskScope(m);
    const t = todayTasks(m).find(x => x.id === id); if (!t) return;
    const done = isTaskDone(scope, t);
    const open = { sessionStart, evening: openEvening, support: openSupport, openLetter, shieldNew: () => openShieldEditor(-1) };
    if (t.act && (!done || t.id === 'pm' || primary)) { open[t.act](); return; }
    setTask(scope, id, !done); save();
    if (!done) { buzz([12, 24, 12]); toast(id === 'ch' ? 'أحسنت! ثمرة ذهبية جديدة على شجرتك' : 'تم — خطوة أقرب', id === 'ch' ? 'sparkles' : 'check'); }
    RENDER.today();
  }
  const ACTIONS = {
    tab: el => { buzz(6); go(el.dataset.tab); },
    closeSheet,
    toggleChallenge: el => {
      const k = el.dataset.key; state.completedChallenges[k] = !state.completedChallenges[k]; save();
      if (state.completedChallenges[k]) { toast('أحسنت! ثمرة ذهبية جديدة على شجرتك', 'sparkles'); buzz([15, 30, 15]); }
      RENDER.today();
    },
    settings: () => openSettings(),
    support: () => openSupport(),
    showCan: () => { state.showCan = state.showCan === false; save(false); openSettings(); if (currentTab === 'today') RENDER.today(); },
    toggleChapter: el => { const n = +el.dataset.n; openChapter = openChapter === n ? -1 : n; RENDER.journey(); },
    ckMood: el => { checkinDraft.mood = +el.dataset.v; buzz(); RENDER.today(); },
    ckCrave: el => { checkinDraft.craving = +el.dataset.v; buzz(); RENDER.today(); },
    ckSave: () => {
      const prev = state.checkins[dateKey()] || {};
      state.checkins[dateKey()] = { mood: checkinDraft.mood ?? prev.mood, craving: checkinDraft.craving ?? prev.craving, ts: Date.now() };
      checkinDraft = {}; checkinEditing = false; save(); toast('سُجّل حضورك اليوم', 'calendar'); RENDER.today();
    },
    checkinEdit: () => { checkinEditing = true; checkinDraft = {}; RENDER.today(); },
    taperAdd: () => { const k = dateKey(); state.taperDailyLogs[k] = (state.taperDailyLogs[k] || 0) + 1; save(); buzz(); RENDER.today(); },
    taperUndo: () => { const k = dateKey(); state.taperDailyLogs[k] = Math.max(0, (state.taperDailyLogs[k] || 0) - 1); save(); RENDER.today(); },
    editGoal: () => openOnb('reward'),
    editPlan: () => openOnb('path'),
    taskGo: el => runTask(el.dataset.id, true),
    taskRow: el => runTask(el.dataset.id, false),
    evening: () => openEvening(),
    shieldNew: () => openShieldEditor(-1),
    quitNow: () => { state.startDateISO = new Date().toISOString(); state.celebrated = 1; state.planOffset = 0; save(); toast('بدأت رحلتك الآن — أنت مستعد', 'flag'); go('today'); },
    relapseNewDate: () => openOnb('quit'),
    relapseGradual: () => {
      const m = metrics();
      state.history.push({ start: state.startDateISO, end: new Date().toISOString(), hours: m.H });
      Object.assign(state, { quitMode: 'gradual', startDateISO: new Date().toISOString(), planOffset: 0, celebrated: 1, alertAck: dateKey() });
      save(); go('today'); toast('تحوّلت إلى التدرّج الذكي — حصتك جاهزة', 'trending-down');
    },
    alertAck: () => { state.alertAck = dateKey(); save(false); rerender(); },
    taperHold: () => { state.planOffset = (state.planOffset || 0) + 7; state.alertAck = dateKey(); save(); toast('ثبّتنا حصتك أسبوعاً إضافياً', 'trending-down'); rerender(); },
    onbTrig: el => { readOnbInputs(); const v = el.dataset.v, T = onb.draft.triggers; onb.draft.triggers = T.includes(v) ? T.filter(x => x !== v) : T.concat(v); buzz(); renderOnb(); },
    onbQuit: el => { readOnbInputs(); onb.draft.quitChoice = el.dataset.v; if (el.dataset.v !== 'custom') onb.draft.start = toLocalInput(quitChoiceDate(el.dataset.v)); buzz(); renderOnb(); },
    journeySeg: el => { journeySeg = el.dataset.v; RENDER.journey(); },
    openDay: el => openDay(+el.dataset.day),
    openBadge: el => openBadge(el.dataset.id),
    alt: el => {
      const a = ALTS[+el.dataset.idx]; $$('[data-action="alt"]').forEach(b => b.setAttribute('aria-pressed', b === el));
      const box = $('#alt-box'); box.hidden = false; box.innerHTML = `${ic(a.icon, 'xs')} ${a.d}`; buzz();
    },
    openReasons, openLetter,
    logCraving: () => openOutcome({ src: 'manual', title: 'سجّل رغبة مرّت بك' }),
    shieldEdit: el => openShieldEditor(+el.dataset.idx),
    shieldQuick: el => { state.shields.push({ when: el.dataset.w, then: SHIELD_THEN[0] }); save(); openShieldEditor(state.shields.length - 1); },
    shieldDel: el => { state.shields.splice(+el.dataset.idx, 1); save(); RENDER.insights(); toast('حُذفت الخطة', 'trash-2'); },
    sessionStart, sessionTool: el => setSessionTool(el.dataset.tool),
    sessionPause: () => {
      sess.paused = !sess.paused;
      if (!sess.paused) sess.end = Date.now() + sess.left * 1000;
      $('#ss-pause').innerHTML = ic(sess.paused ? 'play' : 'pause', 'sm');
      if (sess.paused) breathStop(); else if (sess.tool === 'breath') breathStart();
    },
    sessionEnd: () => {
      if (SESSION_LEN - sess.left < 15) { closeSession(); return; }
      finishSession(false);
    },
    sessionWon: () => finishSession(false),
    breathPattern: el => { state.breathPattern = el.dataset.v; save(false); renderBreath(); breathStart(); },
    gameStart,
    theme: el => { state.theme = el.dataset.v; save(false); applyTheme(); openSettings(); rerender(); },
    haptics: () => { state.haptics = !state.haptics; save(false); buzz(20); openSettings(); },
    share: shareCard,
    cloud: openCloud,
    export: () => {
      const data = Object.assign({}, state, { firebaseConfig: Object.assign({}, state.firebaseConfig, { idToken: '', refreshToken: '' }) });
      const url = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' }));
      const a = document.createElement('a'); a.href = url; a.download = 'naqa-backup-' + dateKey() + '.json'; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000); toast('صُدّرت النسخة الاحتياطية', 'download');
    },
    import: () => $('#import-file').click(),
    resetCounter: () => {
      openSheet(`
        <div class="row"><span class="ibox rose">${ic('rotate-ccw')}</span><div class="grow"><h2 class="h2">بداية جديدة</h2><p class="xs muted" style="margin:0">لا بأس. كل محاولة تقرّبك أكثر.</p></div></div>
        <p class="body">سيبدأ العدّاد من الآن. نحتفظ بأطول فترة حققتها (${fmtDur(metrics().best)})، ودروسك، وأسبابك، ودرعك.</p>
        <textarea class="input" id="rs-lesson" rows="3" maxlength="300" placeholder="ما الذي تعلّمته من هذه المحاولة؟"></textarea>
        <div class="grid-2"><button class="btn" data-action="closeSheet">إلغاء</button><button class="btn danger" id="rs-go">ابدأ من جديد</button></div>`, body => {
        $('#rs-go', body).onclick = () => {
          const m = metrics();
          state.history.push({ start: state.startDateISO, end: new Date().toISOString(), hours: m.H });
          const lesson = $('#rs-lesson', body).value.trim();
          state.slips.push({ ts: Date.now(), lesson, pouches: 0, reset: true });
          state.startDateISO = new Date().toISOString(); state.planOffset = 0; state.celebrated = 1;
          save(); closeSheet(); go('today'); toast('بداية جديدة. شجرة جديدة تُزرع الآن', 'sprout');
        };
      });
    },
    wipe: () => {
      openSheet(`<h2 class="h2">حذف كل البيانات؟</h2><p class="body">سيُحذف كل شيء من هذا الجهاز ولا يمكن التراجع. صدّر نسخة احتياطية أولاً إن أردت.</p>
        <div class="grid-2"><button class="btn" data-action="closeSheet">إلغاء</button><button class="btn danger" id="wp-go">حذف نهائي</button></div>`, body => {
        $('#wp-go', body).onclick = () => { try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(LEGACY_KEY); } catch (e) {} state = defaults(); closeSheet(); applyTheme(); openOnb(0); };
      });
    },
    onbNext: () => { readOnbInputs(); onb.step = Math.min(ONB_STEPS.length - 1, onb.step + 1); renderOnb(); $('#onb').scrollTop = 0; },
    onbBack: () => { readOnbInputs(); onb.step = Math.max(0, onb.step - 1); renderOnb(); },
    onbClose: () => { if (state.onboarded) closeOnb(); },
    onbMode: el => { onb.draft.quitMode = el.dataset.v; buzz(); renderOnb(); },
    onbNow: () => { const n = new Date(); $('#o-start').value = `${n.getFullYear()}-${pad2(n.getMonth() + 1)}-${pad2(n.getDate())}T${pad2(n.getHours())}:${pad2(n.getMinutes())}`; },
    onbReason: el => { readOnbInputs(); const r = el.dataset.v, R = onb.draft.reasons; onb.draft.reasons = R.includes(r) ? R.filter(x => x !== r) : R.concat(r); buzz(); el.setAttribute('aria-pressed', onb.draft.reasons.includes(r)); },
    onbFinish: finishOnb
  };

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (!el || el.disabled) return;
    const fn = ACTIONS[el.dataset.action];
    if (fn) { e.preventDefault(); fn(el, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target.closest('[data-change]'); if (!el) return;
    if (el.dataset.change === 'currency') { state.currency = el.value; save(); toast('تم تغيير العملة'); }
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') { if (!$('#sheet-layer').hidden) closeSheet(); else if (!$('#onb').hidden && state.onboarded) closeOnb(); }
  });
  document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && e.pointerType === 'mouse') showTip(t); });
  document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t && e.pointerType === 'mouse') hideTip(); });
  document.addEventListener('pointerdown', e => {
    const t = e.target.closest && e.target.closest('[data-tip]');
    if (t && e.pointerType !== 'mouse') { showTip(t); clearTimeout(tipT); tipT = setTimeout(hideTip, 1800); } else if (!t) hideTip();
  });
  window.addEventListener('scroll', hideTip, { passive: true });

  $('#import-file').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = ev => {
      try {
        const o = JSON.parse(ev.target.result);
        const fb = state.firebaseConfig;
        state = o.v === 2 ? normalize(o) : migrateV1(o);
        if (!state.firebaseConfig.databaseURL) state.firebaseConfig = fb;
        save(); applyTheme(); go('today'); toast('استُعيدت نسختك بنجاح', 'upload');
      } catch (err) { toast('ملف غير صالح', 'circle-alert'); }
      e.target.value = '';
    };
    rd.readAsText(f);
  });
  $('#gm-canvas').addEventListener('pointerdown', gameTap);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { tick(); missedDayCheck(); if (sess.timer && !sess.paused) sessionTick(); } });
  if (window.matchMedia) matchMedia('(prefers-color-scheme: light)').addEventListener && matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (state.theme === 'auto') applyTheme(); });

  /* =========================================================
     BOOT
     ========================================================= */
  hydrate();
  applyTheme();
  go('today', { keepScroll: true });
  if (!state.onboarded) openOnb('welcome'); else setTimeout(missedDayCheck, 900);
  setInterval(tick, 1000);
  if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
    window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
  }
  </script>
</body>
</html>
