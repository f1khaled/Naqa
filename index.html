<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>نَقَاء — رفيقك للتحرر من أظرف النيكوتين</title>
  <meta name="description" content="نَقَاء: رفيق هادئ وتفاعلي يساعدك على التحرر من أظرف النيكوتين خلال ٣٠ يوماً — خطة يومية واضحة، وعلبة قديمة تُنبت شجرة، ونجدة وقت الرغبة." />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="نَقَاء" />
  <meta name="theme-color" content="#000000" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Readex+Pro:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    /* =========================================================
       DESIGN TOKENS
       ========================================================= */
    :root {
      --font: 'Readex Pro', 'Tajawal', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --font-serif: 'Amiri', 'Noto Naskh Arabic', 'Times New Roman', serif;
      --r-xl: 28px; --r-lg: 22px; --r-md: 16px; --r-sm: 12px;
      --safe-t: env(safe-area-inset-top, 0px);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --ease: cubic-bezier(.2, .8, .2, 1);
      --tabbar-h: 74px;
    }
    :root, [data-theme="light"] {
      color-scheme: light;
      --bg: #FBF7F0;
      --glow-1: rgba(28, 113, 102, .05);
      --glow-2: rgba(246, 201, 160, .14);
      --surface: #FFFFFF;
      --surface-2: #F4EEE5;
      --surface-3: #EAE1D3;
      --glass: rgba(255, 255, 255, .94);
      --line: rgba(30, 42, 47, .08);
      --line-2: rgba(30, 42, 47, .14);
      --ink: #1E2A2F;
      --ink-2: #4A585E;
      --ink-3: #56636A;
      --sage: #1C7166;
      --sage-2: #165C53;
      --sage-ink: #165C53;
      --sage-soft: rgba(28, 113, 102, .09);
      --sand: #A4521C;
      --sand-ink: #A4521C;
      --sand-soft: rgba(246, 201, 160, .38);
      --rose: #A6402A;
      --rose-soft: #FBE5DE;
      --on-accent: #FFFFFF;
      --shadow: 0 1px 2px rgba(30, 42, 47, .04), 0 10px 26px -18px rgba(30, 42, 47, .22);
      --grain-o: 0;
    }
    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #131A23;
      --glow-1: rgba(94, 196, 177, .06);
      --glow-2: rgba(244, 178, 126, .05);
      --surface: #1B2431;
      --surface-2: #253141;
      --surface-3: #303D4F;
      --glass: rgba(27, 36, 49, .94);
      --line: rgba(238, 242, 245, .07);
      --line-2: rgba(238, 242, 245, .13);
      --ink: #EEF2F5;
      --ink-2: #B9C3CE;
      --ink-3: #A3AFBB;
      --sage: #5EC4B1;
      --sage-2: #4BAF9D;
      --sage-ink: #8FDCCB;
      --sage-soft: rgba(94, 196, 177, .14);
      --sand: #F4B27E;
      --sand-ink: #F4B27E;
      --sand-soft: rgba(244, 178, 126, .14);
      --rose: #F29A86;
      --rose-soft: rgba(242, 154, 134, .14);
      --on-accent: #0D211E;
      --shadow: 0 10px 26px -20px rgba(0, 0, 0, .6);
      --grain-o: 0;
    }

    /* =========================================================
       BASE
       ========================================================= */
    *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    [hidden] { display: none !important; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      background-color: var(--bg);
      background-image:
        radial-gradient(120% 60% at 50% -10%, var(--glow-1) 0%, transparent 60%),
        radial-gradient(80% 50% at 90% 110%, var(--glow-2) 0%, transparent 60%);
      background-attachment: fixed;
      color: var(--ink);
      font-family: var(--font);
      font-size: 15px;
      line-height: 1.6;
      overflow-x: hidden;
      transition: background-color .4s var(--ease), color .4s var(--ease);
    }
    body::before {
      content: "";
      position: fixed; inset: 0;
      pointer-events: none;
      z-index: 0;
      opacity: var(--grain-o);
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; padding: 0; }
    button:disabled { cursor: not-allowed; opacity: .4; }
    :focus-visible { outline: 2px solid var(--sage); outline-offset: 2px; border-radius: 10px; }
    ::selection { background: var(--sage-soft); }
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-thumb { background: var(--line-2); border-radius: 99px; }

    .ic { width: 20px; height: 20px; flex-shrink: 0; display: inline-block; vertical-align: middle; }
    .ic.sm { width: 16px; height: 16px; }
    .ic.xs { width: 14px; height: 14px; }
    .ic.lg { width: 26px; height: 26px; }
    .ic.xl { width: 34px; height: 34px; }

    .app {
      position: relative; z-index: 1;
      max-width: 480px;
      margin: 0 auto;
      padding: calc(var(--safe-t) + 14px) 16px calc(var(--tabbar-h) + var(--safe-b) + 28px);
    }
    .view { display: flex; flex-direction: column; gap: 14px; }
    .view.enter { animation: viewIn .45s var(--ease) both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

    /* =========================================================
       TYPOGRAPHY & UTILITIES
       ========================================================= */
    .h1 { font-size: 23px; font-weight: 700; letter-spacing: -.2px; margin: 0; line-height: 1.35; }
    .h2 { font-size: 17px; font-weight: 700; margin: 0; line-height: 1.45; }
    .h3 { font-size: 15px; font-weight: 600; margin: 0; line-height: 1.5; }
    .body { font-size: 14px; line-height: 1.85; color: var(--ink-2); margin: 0; }
    .small { font-size: 13px; }
    .xs { font-size: 12px; }
    .muted { color: var(--ink-3); }
    .ink2 { color: var(--ink-2); }
    .sage { color: var(--sage-ink); }
    .sand { color: var(--sand-ink); }
    .rose { color: var(--rose); }
    .bold { font-weight: 700; }
    .num { font-variant-numeric: tabular-nums; }
    .row { display: flex; align-items: center; gap: 10px; }
    .row.between { justify-content: space-between; }
    .row.wrap { flex-wrap: wrap; }
    .col { display: flex; flex-direction: column; gap: 10px; }
    .grow { flex: 1; min-width: 0; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .sep { height: 1px; background: var(--line); margin: 4px 0; border: 0; }
    .center { text-align: center; }
    .serif { font-family: var(--font-serif); }
    .clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

    /* =========================================================
       COMPONENTS
       ========================================================= */
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 4px 2px 6px; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .logo {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center;
      background: var(--sage-soft);
      color: var(--sage-ink);
    }
    .eyebrow { font-size: 12px; color: var(--ink-3); margin: 0; }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--r-xl);
      padding: 18px;
      box-shadow: var(--shadow);
    }
    .card.tight { padding: 14px; }
    .card.flat { box-shadow: none; }
    .card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
    .ibox {
      width: 40px; height: 40px; border-radius: 14px;
      display: grid; place-items: center; flex-shrink: 0;
      background: var(--sage-soft); color: var(--sage-ink);
    }
    .ibox.sand { background: var(--sand-soft); color: var(--sand-ink); }
    .ibox.rose { background: var(--rose-soft); color: var(--rose); }
    .ibox.sm { width: 32px; height: 32px; border-radius: 11px; }

    .chip {
      display: inline-flex; align-items: center; gap: 6px;
      font-size: 12px; font-weight: 600;
      padding: 5px 11px; border-radius: 99px;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      white-space: nowrap;
    }
    .chip.sage { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .chip.sand { background: var(--sand-soft); color: var(--sand-ink); border-color: transparent; }
    .chip.rose { background: var(--rose-soft); color: var(--rose); border-color: transparent; }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 46px; padding: 0 18px;
      border-radius: 16px;
      font-size: 14px; font-weight: 700;
      background: var(--surface-2); color: var(--ink);
      border: 1px solid var(--line);
      transition: transform .15s var(--ease), background .2s, border-color .2s, opacity .2s;
    }
    .btn:active:not(:disabled) { transform: scale(.97); }
    .btn.primary { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .btn.sand { background: var(--sand); color: var(--on-accent); border-color: transparent; }
    .btn.soft { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .btn.soft-sand { background: var(--sand-soft); color: var(--sand-ink); border-color: transparent; }
    .btn.danger { background: var(--rose-soft); color: var(--rose); border-color: transparent; }
    .btn.ghost { background: transparent; }
    .btn.block { width: 100%; }
    .btn.sm { min-height: 36px; padding: 0 13px; font-size: 13px; border-radius: 12px; }
    .btn.grad { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .btn:disabled { opacity: 1; background: var(--surface-3); color: var(--ink-3); border-color: transparent; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 99px;
      display: grid; place-items: center;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      transition: transform .15s var(--ease), color .2s;
    }
    .icon-btn:active { transform: scale(.94); }
    .icon-btn.sm { width: 34px; height: 34px; }

    .seg {
      display: grid; grid-auto-flow: column; grid-auto-columns: 1fr;
      padding: 4px; gap: 4px;
      background: var(--surface-2);
      border: 1px solid var(--line);
      border-radius: 99px;
    }
    .seg button {
      min-height: 38px; border-radius: 99px;
      font-size: 13px; font-weight: 600; color: var(--ink-3);
      transition: background .25s var(--ease), color .25s;
    }
    .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 4px 14px -6px rgba(0,0,0,.35); border: 1px solid var(--line); }

    .opt {
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
      padding: 10px 6px; border-radius: 16px;
      background: var(--surface-2); color: var(--ink-2);
      border: 1px solid var(--line);
      font-size: 12px; font-weight: 600;
      transition: all .2s var(--ease);
    }
    .opt.inline { flex-direction: row; padding: 9px 12px; }
    .opt[aria-pressed="true"] { background: var(--sage-soft); border-color: var(--sage); color: var(--sage-ink); }
    .opt.sand[aria-pressed="true"] { background: var(--sand-soft); border-color: var(--sand); color: var(--sand-ink); }
    .opt.rose[aria-pressed="true"] { background: var(--rose-soft); border-color: var(--rose); color: var(--rose); }

    .field { display: flex; flex-direction: column; gap: 6px; }
    .field label { font-size: 13px; color: var(--ink-2); font-weight: 500; }
    .input {
      width: 100%; min-height: 46px;
      padding: 10px 14px;
      border-radius: 14px;
      background: var(--surface-2);
      border: 1px solid var(--line-2);
      color: var(--ink);
      font-size: 14px;
      transition: border-color .2s, box-shadow .2s;
    }
    textarea.input { resize: vertical; min-height: 96px; line-height: 1.8; }
    .input:focus { outline: none; border-color: var(--sage); box-shadow: 0 0 0 3px var(--sage-soft); }
    .input[dir="ltr"] { text-align: left; }
    select.input { appearance: none; background-image: linear-gradient(45deg, transparent 50%, var(--ink-3) 50%), linear-gradient(135deg, var(--ink-3) 50%, transparent 50%); background-position: 18px 50%, 13px 50%; background-size: 5px 5px; background-repeat: no-repeat; padding-left: 30px; }

    .bar { height: 8px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .bar > i { display: block; height: 100%; border-radius: 99px; background: var(--sage); transition: width .8s var(--ease); }
    .bar.thin { height: 5px; }

    .switch { position: relative; width: 48px; height: 28px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line-2); transition: background .25s; flex-shrink: 0; }
    .switch::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-3); transition: transform .25s var(--ease), background .25s; }
    .switch[aria-checked="true"] { background: var(--sage); }
    .switch[aria-checked="true"]::after { transform: translateX(-20px); background: var(--on-accent); }

    /* =========================================================
       HERO / SCENE
       ========================================================= */
    .hero { padding: 0; overflow: hidden; }
    .scene { position: relative; aspect-ratio: 360 / 240; height: auto; overflow: hidden; border-radius: var(--r-xl) var(--r-xl) 0 0; }
    .scene > svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    .scene-fade { position: absolute; inset: auto 0 0 0; height: 60px; background: linear-gradient(0deg, var(--surface), transparent); pointer-events: none; }
    .scene-badge { position: absolute; top: 14px; right: 14px; }
    .scene-badge2 { position: absolute; top: 14px; left: 14px; }
    .glass-chip { background: rgba(10, 15, 13, .45); color: #F2EEE7; border: 1px solid rgba(255,255,255,.14); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .hero-body { padding: 16px 20px 20px; position: relative; }
    .counter { display: flex; align-items: baseline; gap: 8px; }
    .counter .big { font-size: 54px; font-weight: 700; line-height: 1; letter-spacing: -1px; }
    .clock { font-size: 15px; color: var(--ink-2); font-weight: 500; letter-spacing: .5px; }
    .clock b { color: var(--ink); font-weight: 600; }
    .leaf-pop { animation: leafPop .9s var(--ease) both; transform-box: fill-box; transform-origin: center; }
    @keyframes leafPop { 0% { transform: scale(0); } 70% { transform: scale(1.25); } 100% { transform: scale(1); } }
    .bud { animation: budPulse 2.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
    @keyframes budPulse { 0%,100% { opacity: .65; transform: scale(.85); } 50% { opacity: 1; transform: scale(1.1); } }
    .firefly { animation: fly 6s ease-in-out infinite; }
    @keyframes fly { 0%,100% { transform: translate(0,0); opacity: .2; } 50% { transform: translate(8px,-10px); opacity: 1; } }
    .twinkle { animation: twinkle 3.5s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { opacity: .9; } 50% { opacity: .3; } }

    .stat {
      background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg);
      padding: 14px; display: flex; flex-direction: column; gap: 8px;
      box-shadow: var(--shadow);
    }
    .stat .v { font-size: 21px; font-weight: 700; line-height: 1.15; }
    .stat .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-inline-start: 3px; }
    .stat .l { font-size: 12px; color: var(--ink-3); }

    .quote {
      font-family: var(--font-serif);
      font-size: 21px; line-height: 1.8;
      text-align: center; margin: 0; color: var(--ink);
    }
    .quote-card { text-align: center; background: linear-gradient(160deg, var(--surface), var(--surface-2)); }
    .quote-mark { color: var(--sand); opacity: .7; }

    .pouches { display: flex; flex-wrap: wrap; gap: 6px; }
    .pouch { width: 22px; height: 14px; border-radius: 6px; border: 1.5px solid var(--sand); opacity: .9; }
    .pouch.used { background: var(--sand); }
    .pouch.over { border-color: var(--rose); background: var(--rose); }

    .day-nav { display: flex; gap: 6px; }
    .callout { border-radius: 18px; padding: 14px; background: var(--surface-2); border: 1px solid var(--line); }
    .callout.sand { background: var(--sand-soft); border-color: transparent; }
    .callout.sage { background: var(--sage-soft); border-color: transparent; }
    .callout-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }

    details.more summary { list-style: none; cursor: pointer; font-size: 13px; color: var(--sage-ink); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
    details.more summary::-webkit-details-marker { display: none; }
    details.more[open] summary .ic { transform: rotate(180deg); }

    /* =========================================================
       JOURNEY PATH
       ========================================================= */
    .chapter-head { display: flex; align-items: center; gap: 12px; }
    .path-wrap { position: relative; width: 320px; max-width: 100%; margin: 6px auto 0; }
    .path-wrap svg.path-line { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
    .node {
      position: absolute; transform: translate(-50%, -50%);
      width: 52px; height: 52px; border-radius: 50%;
      display: grid; place-items: center;
      font-weight: 700; font-size: 16px;
      background: var(--surface-2); color: var(--ink-3);
      border: 2px solid var(--line-2);
      transition: transform .2s var(--ease);
    }
    .node:active:not(:disabled) { transform: translate(-50%, -50%) scale(.93); }
    .node.done { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .node.ms { width: 60px; height: 60px; }
    .node.ms.done { background: var(--sand); }
    .node.current { background: var(--surface); color: var(--ink); border: 3px solid var(--sage); animation: nodePulse 2.6s ease-in-out infinite; width: 62px; height: 62px; font-size: 19px; }
    .node.locked { opacity: .55; }
    .node .tick { position: absolute; bottom: -3px; left: -3px; width: 22px; height: 22px; border-radius: 50%; background: var(--sand); color: var(--on-accent); display: grid; place-items: center; border: 2px solid var(--surface); }
    .node .crown { position: absolute; top: -12px; color: var(--sand); }
    @keyframes nodePulse { 0%,100% { box-shadow: 0 0 0 0 var(--sage-soft); } 50% { box-shadow: 0 0 0 12px transparent; } }
    .node-label { position: absolute; transform: translateY(-50%); width: 118px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
    .node-label b { display: block; font-size: 12.5px; color: var(--ink); font-weight: 600; }
    .node-label .tag { color: var(--sand-ink); font-weight: 700; font-size: 11.5px; display: block; }

    .timeline { position: relative; display: flex; flex-direction: column; gap: 10px; }
    .tl-item { display: grid; grid-template-columns: 44px 1fr; gap: 12px; align-items: start; }
    .tl-dot { width: 44px; height: 44px; border-radius: 15px; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
    .tl-item.done .tl-dot { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .tl-item.next .tl-dot { background: var(--sand-soft); color: var(--sand-ink); border-color: var(--sand); }

    .badge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .badge {
      display: flex; flex-direction: column; align-items: center; gap: 8px; text-align: center;
      padding: 14px 6px; border-radius: 20px;
      background: var(--surface); border: 1px solid var(--line);
    }
    .badge .medal { width: 54px; height: 54px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-3); color: var(--ink-3); position: relative; }
    .badge.on .medal { background: var(--sand); color: var(--on-accent); }
    .badge.on.sage-m .medal { background: var(--sage); color: var(--on-accent); }
    .badge .medal .lk { position: absolute; bottom: -2px; left: -2px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface-2); display: grid; place-items: center; border: 1px solid var(--line-2); }
    .badge .nm { font-size: 12px; font-weight: 600; line-height: 1.4; }
    .badge:not(.on) .nm { color: var(--ink-3); }

    /* =========================================================
       SOS
       ========================================================= */
    .sos-hero { text-align: center; padding: 28px 20px 24px; overflow: hidden; }
    .sos-orb {
      position: relative;
      width: 176px; height: 176px; border-radius: 50%;
      margin: 18px auto 14px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
      background: var(--sage-soft);
      border: 1px solid var(--sage);
      color: var(--ink);
      transition: transform .2s var(--ease);
    }
    .sos-orb:active { transform: scale(.96); }
    .sos-orb::before, .sos-orb::after {
      content: ""; position: absolute; inset: -1px; border-radius: 50%;
      border: 1px solid var(--sage);
      animation: ripple 3.6s ease-out infinite;
    }
    .sos-orb::after { animation-delay: 1.8s; }
    @keyframes ripple { 0% { transform: scale(1); opacity: .55; } 100% { transform: scale(1.45); opacity: 0; } }

    .session {
      position: fixed; inset: 0; z-index: 60;
      background: var(--bg);
      background-image: radial-gradient(90% 50% at 50% 0%, var(--glow-1), transparent 70%);
      overflow-y: auto;
      animation: viewIn .35s var(--ease) both;
    }
    .session-inner { max-width: 480px; margin: 0 auto; padding: calc(var(--safe-t) + 14px) 16px calc(var(--safe-b) + 24px); display: flex; flex-direction: column; gap: 14px; }
    .timer-big { font-size: 34px; font-weight: 700; letter-spacing: 1px; }
    .wave-svg { width: 100%; height: 110px; display: block; }
    .breath-stage { position: relative; width: 220px; height: 220px; margin: 8px auto; display: grid; place-items: center; }
    .breath-ring { position: absolute; inset: 0; border-radius: 50%; border: 1px dashed var(--line-2); }
    .breath-orb {
      width: 120px; height: 120px; border-radius: 50%;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: var(--sage-soft);
      border: 1px solid var(--sage);
      box-shadow: 0 0 40px -18px var(--sage);
      transition-property: transform; transition-timing-function: ease-in-out; transition-duration: 1s;
    }
    .breath-orb .ph { font-size: 15px; font-weight: 700; color: var(--ink); }
    .breath-orb .sec { font-size: 30px; font-weight: 700; color: var(--sand-ink); line-height: 1.1; }
    .game-box { position: relative; height: 300px; border-radius: 22px; overflow: hidden; background: radial-gradient(circle at 50% 120%, var(--sage-soft), var(--surface) 70%); border: 1px solid var(--line); }
    .game-box canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    .game-overlay { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 20px; background: color-mix(in srgb, var(--surface) 82%, transparent); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px); }
    .letter { font-family: var(--font-serif); font-size: 19px; line-height: 1.95; color: var(--ink); white-space: pre-wrap; margin: 0; }

    /* =========================================================
       CHARTS
       ========================================================= */
    .bars { display: flex; align-items: flex-end; gap: 6px; height: 150px; padding-top: 22px; }
    .bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; cursor: default; }
    .bar-track { flex: 1; width: 100%; display: flex; align-items: flex-end; justify-content: center; position: relative; }
    .bar-fill { width: 62%; min-height: 3px; border-radius: 4px 4px 0 0; background: var(--sage); opacity: .5; transition: height .8s var(--ease), opacity .2s; }
    .bar-fill.peak { opacity: 1; }
    .bar-col:hover .bar-fill { opacity: .85; }
    .bar-val { position: absolute; font-size: 11.5px; font-weight: 700; color: var(--ink); transform: translateY(-20px); }
    .bar-lbl { font-size: 11px; color: var(--ink-3); white-space: nowrap; }
    .baseline { height: 1px; background: var(--line-2); margin-top: -1px; }
    .hbar { display: grid; grid-template-columns: 96px 1fr 28px; gap: 10px; align-items: center; font-size: 13px; }
    .hbar .track { height: 10px; border-radius: 99px; background: var(--surface-3); overflow: hidden; }
    .hbar .track i { display: block; height: 100%; border-radius: 4px; background: var(--sage); }
    .chart-svg { width: 100%; display: block; overflow: visible; }

    #tip {
      position: fixed; z-index: 90; pointer-events: none;
      background: var(--ink); color: var(--bg);
      font-size: 12px; font-weight: 600;
      padding: 6px 10px; border-radius: 10px;
      transform: translate(-50%, calc(-100% - 10px));
      white-space: nowrap; opacity: 0; transition: opacity .15s;
    }
    #tip.on { opacity: 1; }

    /* =========================================================
       LIST ROWS (settings)
       ========================================================= */
    .list { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); overflow: hidden; box-shadow: var(--shadow); }
    .list-row { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; text-align: right; border-bottom: 1px solid var(--line); min-height: 60px; }
    .list-row:last-child { border-bottom: 0; }
    button.list-row:active { background: var(--surface-2); }
    .list-row .t { font-size: 14px; font-weight: 600; }
    .list-row .s { font-size: 12px; color: var(--ink-3); }
    .group-title { font-size: 12.5px; color: var(--ink-3); font-weight: 600; margin: 8px 6px -4px; }

    /* =========================================================
       TABBAR
       ========================================================= */
    .tabbar {
      position: fixed; z-index: 40;
      bottom: calc(var(--safe-b) + 12px); left: 50%; transform: translateX(-50%);
      width: calc(100% - 24px); max-width: 456px;
      height: 66px;
      display: grid; grid-template-columns: repeat(4, 1fr); align-items: center;
      padding: 0 6px;
      background: var(--glass);
      backdrop-filter: blur(24px) saturate(150%); -webkit-backdrop-filter: blur(24px) saturate(150%);
      border: 1px solid var(--line-2);
      border-radius: 24px;
      box-shadow: 0 10px 30px -18px rgba(0,0,0,.5);
    }
    .tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; height: 100%; font-size: 11.5px; font-weight: 600; color: var(--ink-3); transition: color .2s; }
    .tab .ic { width: 22px; height: 22px; transition: transform .25s var(--ease); }
    .tab[aria-current="page"] { color: var(--ink); }
    .tab[aria-current="page"] .ic { color: var(--sage); transform: translateY(-1px); }
    .tab-sos .sos-core {
      width: 52px; height: 30px; border-radius: 99px;
      display: grid; place-items: center;
      background: var(--sage); color: var(--on-accent);
    }
    .tab-sos .sos-core .ic { color: var(--on-accent) !important; }

    /* =========================================================
       SHEETS, ONBOARDING, TOAST
       ========================================================= */
    .sheet-layer { position: fixed; inset: 0; z-index: 88; display: flex; align-items: flex-end; justify-content: center; }
    .sheet-backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); animation: fadeIn .25s both; }
    .sheet {
      position: relative; width: 100%; max-width: 480px; max-height: 90vh; max-height: 90dvh; overflow-y: auto;
      background: var(--surface);
      border: 1px solid var(--line-2); border-bottom: 0;
      border-radius: 30px 30px 0 0;
      padding: 10px 20px calc(var(--safe-b) + 22px);
      animation: sheetUp .38s var(--ease) both;
    }
    .sheet-handle { width: 40px; height: 5px; border-radius: 99px; background: var(--line-2); margin: 2px auto 14px; }
    .sheet-body { display: flex; flex-direction: column; gap: 14px; }
    @keyframes sheetUp { from { transform: translateY(100%); } to { transform: none; } }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    .onb { position: fixed; inset: 0; z-index: 80; background: var(--bg); background-image: radial-gradient(120% 60% at 50% -10%, var(--glow-1), transparent 60%), radial-gradient(80% 50% at 90% 110%, var(--glow-2), transparent 60%); overflow-y: auto; }
    .onb-inner { max-width: 480px; min-height: 100%; margin: 0 auto; padding: calc(var(--safe-t) + 18px) 20px calc(var(--safe-b) + 22px); display: flex; flex-direction: column; gap: 18px; }
    .steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; flex: 1; }
    .steps i { height: 4px; border-radius: 99px; background: var(--surface-3); transition: background .3s; }
    .steps i.on { background: var(--sage); }
    .onb-body { display: flex; flex-direction: column; gap: 16px; animation: viewIn .4s var(--ease) both; flex: 1; }
    .onb-actions { display: flex; gap: 10px; position: sticky; bottom: 0; padding-top: 8px; }
    .path-card { text-align: right; padding: 16px; border-radius: 22px; background: var(--surface); border: 1.5px solid var(--line); display: flex; gap: 14px; align-items: flex-start; transition: border-color .2s, background .2s; width: 100%; }
    .path-card[aria-pressed="true"] { border-color: var(--sage); background: var(--sage-soft); }
    .path-card.sandy[aria-pressed="true"] { border-color: var(--sand); background: var(--sand-soft); }
    .welcome-hero { text-align: center; padding-top: 18px; }
    .welcome-logo { width: 84px; height: 84px; margin: 0 auto 16px; border-radius: 28px; display: grid; place-items: center; background: var(--sage-soft); color: var(--sage-ink); }
    .feature { display: flex; gap: 12px; align-items: flex-start; text-align: right; }

    #toast {
      position: fixed; z-index: 95; bottom: calc(var(--safe-b) + 92px); left: 50%;
      transform: translate(-50%, calc(100% + 120px));
      visibility: hidden;
      max-width: calc(100% - 32px);
      display: flex; align-items: center; gap: 8px;
      padding: 10px 16px; border-radius: 99px;
      background: var(--surface-2); color: var(--ink); border: 1px solid var(--line-2);
      font-size: 13px; font-weight: 600;
      box-shadow: 0 14px 30px -12px rgba(0,0,0,.5);
      transition: transform .4s var(--ease), visibility 0s .4s;
    }
    #toast.on { transform: translate(-50%, 0); visibility: visible; transition: transform .4s var(--ease); }
    #confetti { position: fixed; inset: 0; z-index: 96; pointer-events: none; width: 100%; height: 100%; }

    .strip { display: grid; grid-template-columns: repeat(3, 1fr); width: 100%; text-align: center; padding: 14px 6px; }
    .strip > div + div { border-inline-start: 1px solid var(--line); }
    .strip .v { font-size: 18px; font-weight: 700; line-height: 1.3; }
    .strip .v small { font-size: 11.5px; font-weight: 500; color: var(--ink-3); }
    .strip .l { font-size: 12px; color: var(--ink-3); }
    #float-words { position: absolute; inset: 0; pointer-events: none; }
    .float-word {
      position: absolute; left: 26.7%; top: 80%;
      transform: translate(-50%, -50%);
      font-size: 13.5px; font-weight: 600; white-space: nowrap;
      color: #EEF1EC; background: rgba(15, 21, 19, .55);
      border: 1px solid rgba(255, 255, 255, .12);
      padding: 4px 12px; border-radius: 99px;
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      animation: wordRise 5.2s ease-in-out forwards;
    }
    [data-theme="light"] .float-word { color: var(--ink); background: rgba(255, 255, 255, .82); border-color: var(--line-2); }
    @keyframes wordRise {
      0% { opacity: 0; left: 26.7%; top: 80%; transform: translate(-50%, -50%) scale(.7); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; left: 46%; top: 26%; transform: translate(-50%, -50%) scale(.96); }
    }
    @media (prefers-reduced-motion: reduce) { .float-word { animation: none !important; left: 50%; top: 18%; opacity: 1; } }
    .scene.compact { aspect-ratio: 360 / 170; }
    .scene.compact .float-word { animation-name: wordRiseC; top: 74%; }
    @keyframes wordRiseC {
      0% { opacity: 0; left: 26.7%; top: 74%; transform: translate(-50%, -50%) scale(.7); }
      15% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
      78% { opacity: 1; }
      100% { opacity: 0; left: 46%; top: 16%; transform: translate(-50%, -50%) scale(.96); }
    }
    .next-task { background: var(--sage-soft); border-radius: 18px; padding: 14px; margin-bottom: 8px; }
    .tasks { display: flex; flex-direction: column; }
    .task { display: flex; align-items: flex-start; gap: 12px; width: 100%; text-align: right; padding: 11px 2px; border-top: 1px solid var(--line); }
    .task:first-child { border-top: 0; }
    .task .t { display: block; color: var(--ink); line-height: 1.7; }
    .task[aria-pressed="true"] .t { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--line-2); }
    .tick-box { width: 22px; height: 22px; border-radius: 7px; border: 1.5px solid var(--line-2); display: grid; place-items: center; flex-shrink: 0; margin-top: 2px; color: var(--on-accent); }
    .task[aria-pressed="true"] .tick-box { background: var(--sage); border-color: transparent; }
    .day-dots { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
    .dd { width: 30px; height: 30px; border-radius: 50%; font-size: 12px; font-weight: 600; background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
    .dd.done { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .dd.ms { border-color: var(--sand); }
    .dd.cur { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .day-row { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; padding: 10px 4px; border-top: 1px solid var(--line); }
    .day-row.cur { background: var(--sage-soft); border-radius: 12px; border-top-color: transparent; padding-inline: 8px; }
    .plan-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
    .plan-row:last-child { border-bottom: 0; }
    button.scene { display: block; width: 100%; padding: 0; cursor: pointer; }
    .scene-help { position: absolute; top: 10px; left: 10px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: rgba(255, 255, 255, .7); color: #1E2A2F; }
    [data-theme="dark"] .scene-help { background: rgba(19, 26, 35, .6); color: #EEF2F5; }
    .ms-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; text-align: center; }
    .ms { display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 600; color: var(--ink-3); }
    .ms .medal { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--surface-2); color: var(--ink-3); }
    .ms.on { color: var(--ink); }
    .ms.on .medal { background: var(--sand-soft); color: var(--sand-ink); }
    .j-big { font-size: 46px; font-weight: 700; line-height: 1.05; letter-spacing: -1px; }
    .j-big small { font-size: 16px; font-weight: 500; color: var(--ink-3); letter-spacing: 0; }
    .cells { display: grid; grid-template-columns: repeat(30, 1fr); gap: 3px; margin-top: 18px; }
    .cell { position: relative; height: 10px; border-radius: 3px; background: var(--surface-3); }
    .cell.done { background: var(--sage); }
    .cell.cur { background: var(--sage); opacity: .45; animation: budPulse 2.6s ease-in-out infinite; }
    .cell.wk { margin-inline-start: 4px; }
    .cell.ms::after { content: ""; position: absolute; top: -10px; left: 50%; width: 6px; height: 6px; border-radius: 1.5px; transform: translateX(-50%) rotate(45deg); background: var(--ink-3); opacity: .5; }
    .cell.ms-on::after { background: var(--sand); opacity: 1; }
    .up-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--line); }
    .up-row:first-of-type { border-top: 0; }
    .tiles { display: grid; grid-template-columns: repeat(var(--n), 1fr); gap: 6px; margin-top: 14px; }
    .tile { position: relative; aspect-ratio: 1 / 1.2; border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; font-size: 15px; font-weight: 700; color: var(--ink-3); background: transparent; border: 1px solid var(--line-2); transition: transform .15s var(--ease); }
    .tile small { font-size: 10px; font-weight: 600; min-height: 12px; }
    .tile.done { background: var(--sage-soft); color: var(--sage-ink); border-color: transparent; }
    .tile.cur { background: var(--sage); color: var(--on-accent); border-color: transparent; }
    .tile.sel { box-shadow: 0 0 0 2px var(--surface), 0 0 0 4px var(--sage); }
    .tile .st { position: absolute; top: 2px; left: 3px; color: var(--sand); line-height: 0; }
    .tile.cur .st { color: var(--on-accent); }
    .tile .st .ic { width: 11px; height: 11px; }
    .day-peek { display: flex; align-items: center; gap: 10px; width: 100%; text-align: right; margin-top: 14px; padding: 12px 14px; border-radius: 16px; background: var(--surface-2); }
    .wk-row { display: flex; align-items: center; gap: 12px; width: 100%; text-align: right; padding: 14px 16px; border-bottom: 1px solid var(--line); }
    .mini-links { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
    .mini-links button { font-size: 13px; font-weight: 600; color: var(--sage-ink); display: inline-flex; align-items: center; gap: 4px; }
    .link-btn { display: block; margin: 0 auto; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--ink-3); text-decoration: underline; text-decoration-color: var(--line-2); text-underline-offset: 4px; }
    .has-dot { position: relative; }
    .has-dot::after { content: ""; position: absolute; top: 6px; right: 6px; width: 9px; height: 9px; border-radius: 50%; background: var(--sand); border: 2px solid var(--surface-2); }
    .more-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-xl); padding: 14px 18px; }
    .more-card > summary { width: 100%; justify-content: center; }
    .empty { text-align: center; padding: 26px 18px; }
    .empty .ibox { margin: 0 auto 12px; width: 56px; height: 56px; border-radius: 20px; }

    @media (min-width: 560px) {
      .app { padding-top: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; }
    }

    /* =========================================================
       DESIGN LAYER v8 — system type, grouped surfaces, materials, motion
       ========================================================= */
    :root, [data-theme="light"] {
      --font: -apple-system, BlinkMacSystemFont, "SF Arabic", "SF Pro Text", "Readex Pro", "Segoe UI", system-ui, sans-serif;
      --bg: #F2F2F7;
      --glow-1: transparent; --glow-2: transparent;
      --surface: #FFFFFF;
      --surface-2: rgba(118, 118, 128, .12);
      --surface-3: rgba(118, 118, 128, .2);
      --glass: rgba(249, 249, 249, .78);
      --line: rgba(60, 60, 67, .13);
      --line-2: rgba(60, 60, 67, .22);
      --ink: #0B0B0C;
      --ink-2: #3A3A3C;
      --ink-3: #6E6E73;
      --sage: #007A68;
      --sage-2: #00695A;
      --sage-ink: #007A68;
      --sage-soft: rgba(0, 122, 104, .11);
      --sand: #B35000;
      --sand-ink: #B35000;
      --sand-soft: rgba(255, 149, 0, .14);
      --rose: #D70015;
      --rose-soft: rgba(255, 59, 48, .11);
      --on-accent: #FFFFFF;
      --shadow: 0 1px 1px rgba(0, 0, 0, .02);
      --ease: cubic-bezier(.32, .72, 0, 1);
      --r-xl: 22px;
    }
    [data-theme="dark"] {
      --bg: #000000;
      --surface: #1C1C1E;
      --surface-2: rgba(118, 118, 128, .24);
      --surface-3: rgba(118, 118, 128, .36);
      --glass: rgba(22, 22, 24, .76);
      --line: rgba(84, 84, 88, .55);
      --line-2: rgba(120, 120, 128, .6);
      --ink: #FFFFFF;
      --ink-2: rgba(235, 235, 245, .82);
      --ink-3: #A1A1A8;
      --sage: #30D5B5;
      --sage-2: #2AC2A4;
      --sage-ink: #30D5B5;
      --sage-soft: rgba(48, 213, 181, .16);
      --sand: #FF9F0A;
      --sand-ink: #FF9F0A;
      --sand-soft: rgba(255, 159, 10, .16);
      --rose: #FF6961;
      --rose-soft: rgba(255, 105, 97, .16);
      --on-accent: #002E26;
      --shadow: none;
    }
    body { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; letter-spacing: 0; background-image: none; }
    body::before { display: none; }
    .app { padding-top: calc(var(--safe-t) + 8px); transition: transform .5s var(--ease), border-radius .5s var(--ease), filter .5s var(--ease); transform-origin: 50% 0; }
    body.sheet-open .app { transform: scale(.94) translateY(8px); border-radius: 14px; filter: brightness(.92); }
    .view { gap: 16px; }
    .view.enter { animation: viewIn .32s var(--ease) both; }
    @keyframes viewIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    /* type scale */
    .h1 { font-size: 32px; font-weight: 800; letter-spacing: -.2px; line-height: 1.2; }
    .h2 { font-size: 20px; font-weight: 700; line-height: 1.35; }
    .h3 { font-size: 17px; font-weight: 600; line-height: 1.45; }
    .body { font-size: 16px; line-height: 1.7; color: var(--ink-2); }
    .small { font-size: 15px; }
    .xs { font-size: 13px; }
    .eyebrow { font-size: 13px; font-weight: 600; color: var(--ink-3); }

    /* large title header */
    .topbar { padding: 10px 2px 2px; align-items: flex-end; }
    .topbar .h1, .topbar .h2 { font-size: 32px; font-weight: 800; }
    .logo { display: none; }
    .brand { gap: 0; }

    /* compact navigation bar that appears on scroll */
    .navbar {
      position: fixed; z-index: 45; top: 0; left: 0; right: 0;
      height: calc(var(--safe-t) + 44px); padding-top: var(--safe-t);
      display: grid; place-items: center;
      font-size: 17px; font-weight: 600; color: var(--ink);
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: .5px solid var(--line);
      opacity: 0; transform: translateY(-4px); pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }
    .navbar.show { opacity: 1; transform: none; }

    /* surfaces */
    .card { border: 0; box-shadow: var(--shadow); border-radius: var(--r-xl); padding: 18px; }
    .card.tight { padding: 14px 16px; }
    .callout { border: 0; border-radius: 14px; background: var(--surface-2); }
    .ibox { border-radius: 12px; }
    .chip { border: 0; background: var(--surface-2); color: var(--ink-2); font-weight: 600; padding: 5px 11px; }
    .chip.sage { background: var(--sage-soft); color: var(--sage-ink); }

    /* buttons */
    .btn { min-height: 50px; border-radius: 14px; border: 0; font-size: 17px; font-weight: 600; background: var(--surface-2); color: var(--sage-ink); }
    .btn.sm { min-height: 36px; font-size: 15px; border-radius: 10px; padding: 0 14px; }
    .btn.primary, .btn.grad { background: var(--sage); color: var(--on-accent); }
    .btn.soft { background: var(--sage-soft); color: var(--sage-ink); }
    .btn.soft-sand { background: var(--sand-soft); color: var(--sand-ink); }
    .btn.sand { background: var(--sand); color: #fff; }
    [data-theme="dark"] .btn.sand { color: #2B1700; }
    .btn.danger { background: var(--rose-soft); color: var(--rose); }
    .btn.ghost { background: transparent; color: var(--sage-ink); }
    .btn:active:not(:disabled) { transform: scale(.97); opacity: .85; }
    .btn:disabled { background: var(--surface-2); color: var(--ink-3); opacity: .7; }
    .icon-btn { width: 36px; height: 36px; border: 0; background: var(--surface-2); color: var(--sage-ink); }
    .icon-btn.sm { width: 32px; height: 32px; }

    /* segmented control */
    .seg { border: 0; border-radius: 10px; padding: 2px; gap: 0; background: var(--surface-2); }
    .seg button { min-height: 32px; border-radius: 8px; font-size: 14px; font-weight: 600; color: var(--ink); }
    .seg button[aria-pressed="true"] { background: var(--surface); border: 0; box-shadow: 0 3px 8px rgba(0, 0, 0, .12), 0 1px 1px rgba(0, 0, 0, .04); }
    [data-theme="dark"] .seg button[aria-pressed="true"] { background: #636366; }

    /* options */
    .opt { border: 0; background: var(--surface-2); color: var(--ink); border-radius: 14px; font-size: 13px; }
    .opt[aria-pressed="true"] { background: var(--sage-soft); color: var(--sage-ink); box-shadow: inset 0 0 0 2px var(--sage); }
    .opt.sand[aria-pressed="true"] { background: var(--sand-soft); color: var(--sand-ink); box-shadow: inset 0 0 0 2px var(--sand); }
    .opt.rose[aria-pressed="true"] { background: var(--rose-soft); color: var(--rose); box-shadow: inset 0 0 0 2px var(--rose); }
    .path-card { border: 0; background: var(--surface); }
    .path-card[aria-pressed="true"], .path-card.sandy[aria-pressed="true"] { background: var(--surface); box-shadow: inset 0 0 0 2px var(--sage); }

    /* inputs */
    .input { border: 0; background: var(--surface); border-radius: 12px; min-height: 48px; font-size: 17px; }
    .onb .input, .sheet .input { background: var(--surface-2); }
    .input:focus { box-shadow: 0 0 0 2px var(--sage); }

    /* switch */
    .switch { width: 51px; height: 31px; border: 0; background: var(--surface-3); }
    .switch::after { top: 2px; right: 2px; width: 27px; height: 27px; background: #fff; box-shadow: 0 3px 8px rgba(0, 0, 0, .15), 0 1px 1px rgba(0, 0, 0, .16); }
    .switch[aria-checked="true"] { background: #34C759; }
    .switch[aria-checked="true"]::after { transform: translateX(-20px); background: #fff; }

    /* progress */
    .bar { height: 6px; background: var(--surface-2); }
    .bar.thin { height: 4px; }
    .bar > i { background: var(--sage); }

    /* inset grouped lists */
    .list { border: 0; box-shadow: none; border-radius: 14px; }
    .list-row { position: relative; border: 0; min-height: 52px; padding: 11px 16px; gap: 14px; }
    .list-row + .list-row::before { content: ""; position: absolute; top: 0; left: 0; right: 60px; height: .5px; background: var(--line); }
    .list-row .t { font-size: 17px; font-weight: 400; }
    .list-row .s { font-size: 13px; }
    .list-row .ibox.sm { width: 30px; height: 30px; border-radius: 8px; background: var(--sage); color: #fff; }
    .list-row .ibox.sm.sand { background: #FF9500; }
    .list-row .ibox.sm.rose { background: #FF3B30; }
    .list-row .ibox.sm .ic { width: 17px; height: 17px; }
    .group-title { font-size: 13px; font-weight: 400; text-transform: none; color: var(--ink-3); margin: 12px 16px -8px; }

    /* tab bar: full width material */
    .tabbar {
      left: 0; right: 0; bottom: 0; transform: none; width: 100%; max-width: none;
      height: calc(52px + var(--safe-b)); padding: 0 max(8px, calc((100% - 480px) / 2)) var(--safe-b);
      border-radius: 0; border: 0; border-top: .5px solid var(--line);
      background: var(--glass);
      backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px);
      box-shadow: none;
    }
    .tab { font-size: 10.5px; font-weight: 500; gap: 2px; color: #8E8E93; }
    .tab .ic { width: 25px; height: 25px; }
    .tab[aria-current="page"] { color: var(--sage); }
    .tab[aria-current="page"] .ic { color: var(--sage); transform: none; }
    .tab-sos .sos-core { width: 46px; height: 28px; border-radius: 99px; background: var(--sage); }
    .tab-sos .sos-core .ic { width: 20px; height: 20px; }
    .app { padding-bottom: calc(52px + var(--safe-b) + 28px); }

    /* sheets */
    .sheet { border: 0; border-radius: 16px 16px 0 0; background: var(--bg); padding: 8px 18px calc(var(--safe-b) + 22px); animation: sheetUp .5s var(--ease) both; }
    [data-theme="dark"] .sheet { background: #1C1C1E; }
    .sheet .card, .sheet .list { background: var(--surface); }
    [data-theme="dark"] .sheet .card, [data-theme="dark"] .sheet .list { background: #2C2C2E; }
    .sheet-handle { width: 36px; height: 5px; background: var(--surface-3); margin: 0 auto 12px; }
    .sheet-backdrop { background: rgba(0, 0, 0, .3); backdrop-filter: none; -webkit-backdrop-filter: none; }

    /* toast as a floating material capsule */
    #toast { background: var(--glass); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border: .5px solid var(--line); box-shadow: 0 10px 30px rgba(0, 0, 0, .12); color: var(--ink); font-weight: 600; }

    /* hero: sky with a large light number */
    .hero { padding: 0; overflow: hidden; }
    .sky { position: relative; display: block; width: 100%; height: 290px; padding: 0; overflow: hidden; }
    .sky > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
    .sky-top { position: absolute; top: 18px; right: 20px; left: 20px; display: flex; flex-direction: column; align-items: flex-start; color: #fff; text-shadow: 0 1px 14px rgba(0, 0, 0, .18); pointer-events: none; }
    .sky-lbl { font-size: 15px; font-weight: 600; opacity: .92; }
    .sky-num { font-size: 86px; font-weight: 200; line-height: .95; letter-spacing: -2px; margin-top: 2px; }
    .sky-unit { font-size: 20px; font-weight: 500; opacity: .95; margin-top: 2px; }
    .sky .scene-help { top: 14px; left: 14px; background: rgba(255, 255, 255, .22); color: #fff; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
    .hero .hero-body { padding: 14px 18px 18px; }

    /* SOS orb: soft luminous gradient */
    .sos-orb { background: radial-gradient(circle at 50% 35%, rgba(48, 213, 181, .28), rgba(0, 122, 104, .12) 60%, transparent 72%), var(--sage-soft); border: 0; box-shadow: 0 0 0 10px var(--sage-soft); }
    .sos-orb::before, .sos-orb::after { border-color: var(--sage); }
    .breath-orb { border: 0; background: radial-gradient(circle at 50% 35%, rgba(48, 213, 181, .5), rgba(0, 122, 104, .25) 70%); box-shadow: 0 0 60px -10px rgba(48, 213, 181, .55); }

    /* journey refinements */
    .j-big { font-size: 56px; font-weight: 800; letter-spacing: -1.5px; }
    .tile { border: 0; background: var(--surface-2); border-radius: 12px; }
    .tile.done { background: var(--sage-soft); }
    .cell { height: 8px; border-radius: 4px; background: var(--surface-2); }
    .day-peek { background: var(--surface-2); border-radius: 14px; }
    .wk-row + .wk-row { border-top: 0; }
    .wk-row { border-bottom: .5px solid var(--line); }

    /* profile header */
    .profile-head { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 6px; padding: 22px 18px; }
    .avatar { width: 84px; height: 84px; border-radius: 50%; display: grid; place-items: center; font-size: 34px; font-weight: 700; color: #fff; background: linear-gradient(160deg, #30D5B5, #007A68); }

    /* onboarding: centered welcome */
    .onb { background: var(--bg); background-image: none; }
    .welcome-logo { width: 96px; height: 96px; border-radius: 24px; background: linear-gradient(160deg, #30D5B5, #007A68); color: #fff; box-shadow: 0 12px 30px -12px rgba(0, 122, 104, .6); }
    .feature .ibox { background: transparent; color: var(--sage); width: 36px; }
    .feature .ibox .ic { width: 28px; height: 28px; }
    .steps i { height: 3px; }

    .mini-links button { font-size: 15px; font-weight: 400; color: var(--sage-ink); }
    .link-btn { font-size: 15px; font-weight: 400; color: var(--sage-ink); text-decoration: none; }

    /* =========================================================
       MOTION v9
       ========================================================= */
    .sway { transform-box: view-box; transform-origin: 180px 176px; animation: sway 7s ease-in-out infinite; }
    @keyframes sway { 0%, 100% { transform: rotate(-.9deg); } 50% { transform: rotate(.9deg); } }
    .cloud { animation: drift 38s ease-in-out infinite alternate; }
    @keyframes drift { from { transform: translateX(-14px); } to { transform: translateX(14px); } }
    .sun-glow { transform-box: fill-box; transform-origin: center; animation: glow 5s ease-in-out infinite; }
    @keyframes glow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.08); opacity: 1; } }
    .fruit-pop { transform-box: fill-box; transform-origin: center; animation: fruitPop .9s cubic-bezier(.34, 1.56, .64, 1) both .25s; }
    @keyframes fruitPop { from { transform: scale(0); } to { transform: scale(1); } }

    .view.enter .bar > i, .view.enter .cell.done { animation: barIn .9s var(--ease) both .1s; transform-origin: right center; }
    @keyframes barIn { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .view.enter .card { animation: cardIn .5s var(--ease) both; }
    .view.enter .card:nth-of-type(2) { animation-delay: .04s; }
    .view.enter .card:nth-of-type(3) { animation-delay: .08s; }
    .view.enter .card:nth-of-type(4) { animation-delay: .12s; }
    @keyframes cardIn { from { opacity: 0; transform: translateY(10px) scale(.99); } to { opacity: 1; transform: none; } }

    .next-task { position: relative; overflow: hidden; }
    .next-task.leaving > *:not(.done-check) { animation: taskOut .42s var(--ease) forwards; }
    @keyframes taskOut { to { opacity: 0; transform: translateX(-18px); } }
    .next-task.arriving > * { animation: taskIn .5s var(--ease) both; }
    @keyframes taskIn { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
    .done-check { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none; }
    .done-check svg { width: 64px; height: 64px; }
    .dc-c { fill: var(--sage); opacity: 0; animation: dcIn .25s ease forwards; }
    .dc-p { fill: none; stroke: var(--on-accent); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 40; stroke-dashoffset: 40; animation: dcDraw .35s ease forwards .15s; }
    @keyframes dcIn { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: none; } }
    @keyframes dcDraw { to { stroke-dashoffset: 0; } }
    .dc-c { transform-box: fill-box; transform-origin: center; }

    .tab:active .ic { transform: scale(.86); transition: transform .1s; }
    .tile:active, .opt:active, .list-row:active { transform: scale(.98); }

    .sheet-grab { height: 26px; margin: -8px -18px 2px; display: grid; place-items: center; touch-action: none; cursor: grab; }
    .sheet-grab .sheet-handle { margin: 0; }
    .sheet-layer.closing { pointer-events: none; }
    .sheet-layer.closing .sheet { animation: sheetDown .26s var(--ease) forwards; }
    .sheet-layer.closing .sheet-backdrop { animation: fadeOut .26s ease forwards; }
    @keyframes sheetDown { to { transform: translateY(100%); } }
    @keyframes fadeOut { to { opacity: 0; } }

    /* full-screen celebration */
    .celebrate { position: fixed; inset: 0; z-index: 92; display: grid; place-items: center; padding: 24px; color: #fff; text-align: center;
      background: radial-gradient(120% 80% at 50% 30%, #0F6B5E 0%, #06332D 60%, #021A17 100%); opacity: 0; transition: opacity .35s ease; }
    .celebrate.on { opacity: 1; }
    .cel-rays { position: absolute; width: 640px; height: 640px; left: 50%; top: 38%; margin: -320px 0 0 -320px; border-radius: 50%;
      background: repeating-conic-gradient(rgba(255,255,255,.06) 0 10deg, transparent 10deg 20deg); animation: spin 40s linear infinite;
      -webkit-mask: radial-gradient(circle, #000 20%, transparent 65%); mask: radial-gradient(circle, #000 20%, transparent 65%); }
    @keyframes spin { to { transform: rotate(360deg); } }
    .cel-body { position: relative; max-width: 340px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
    .cel-medal { width: 120px; height: 120px; border-radius: 50%; display: grid; place-items: center; color: #3A2400;
      background: radial-gradient(circle at 35% 30%, #FFF0C2, #FFC453 55%, #E08A1E); box-shadow: 0 20px 60px -10px rgba(255, 196, 83, .6), inset 0 -6px 14px rgba(0,0,0,.15);
      transform: scale(.4); opacity: 0; transition: transform .7s cubic-bezier(.34, 1.56, .64, 1) .1s, opacity .3s ease .1s; }
    .cel-medal .ic { width: 52px; height: 52px; }
    .celebrate.on .cel-medal { transform: none; opacity: 1; }
    .cel-kicker { margin: 10px 0 0; font-size: 14px; font-weight: 600; letter-spacing: .5px; color: #FFD27A; }
    .cel-title { margin: 0; font-size: 40px; font-weight: 800; line-height: 1.15; }
    .cel-text { margin: 0; font-size: 17px; line-height: 1.7; color: rgba(255,255,255,.86); }
    .cel-sub { margin: 4px 0 10px; font-size: 14px; color: rgba(255,255,255,.7); }
    .cel-body > *:not(.cel-medal) { opacity: 0; transform: translateY(8px); transition: opacity .5s ease, transform .5s var(--ease); }
    .celebrate.on .cel-body > *:not(.cel-medal) { opacity: 1; transform: none; transition-delay: .35s; }
    .cel-btn { width: 220px; background: #fff; color: #06332D; }

    /* immersive SOS session */
    .session {
      --sage: #8CF0D9; --sage-ink: #8CF0D9; --sage-soft: rgba(140, 240, 217, .14); --sand: #FFD27A; --sand-ink: #FFD27A; --sand-soft: rgba(255, 210, 122, .14);
      --surface: #062925; --surface-2: rgba(255, 255, 255, .1); --surface-3: rgba(255, 255, 255, .18);
      --ink: #FFFFFF; --ink-2: rgba(234, 247, 244, .85); --ink-3: rgba(234, 247, 244, .62); --line: rgba(255, 255, 255, .1); --line-2: rgba(255, 255, 255, .22); --on-accent: #063A33;
      background: radial-gradient(120% 70% at 50% 0%, #0E5A50 0%, #063A33 45%, #031B18 100%); color: #EAF7F4;
    }
    .session .card { background: rgba(255, 255, 255, .07); }
    .session .seg button[aria-pressed="true"] { background: rgba(255, 255, 255, .22); color: #fff; box-shadow: none; }
    .session .btn { background: rgba(255, 255, 255, .12); color: #fff; }
    .session .btn.grad, .session .btn.primary { background: #fff; color: #063A33; }
    .session .icon-btn { background: rgba(255, 255, 255, .12); color: #fff; }
    .session .timer-big { font-size: 48px; font-weight: 200; color: #fff; letter-spacing: 1px; }
    .session .breath-stage { width: 290px; height: 290px; }
    .session .breath-ring { border: 1px solid rgba(255, 255, 255, .14); box-shadow: 0 0 0 28px rgba(255, 255, 255, .025), 0 0 0 56px rgba(255, 255, 255, .015); }
    .session .breath-orb { width: 156px; height: 156px; background: radial-gradient(circle at 50% 36%, rgba(170, 255, 236, .9), rgba(48, 213, 181, .5) 45%, rgba(0, 122, 104, .18) 76%); box-shadow: 0 0 90px 12px rgba(48, 213, 181, .35), inset 0 0 30px rgba(255, 255, 255, .25); }
    .session .breath-orb .ph { color: #fff; font-size: 20px; }
    .session .breath-orb .sec { color: #fff; font-size: 44px; font-weight: 200; }
    .session .stat { background: rgba(255, 255, 255, .07); box-shadow: none; }

    /* launch screen */
    #launch { position: fixed; inset: 0; z-index: 99; display: grid; place-items: center; background: var(--bg); transition: opacity .4s ease; }
    #launch.out { opacity: 0; pointer-events: none; }
    #launch .l-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; animation: launchIn .6s var(--ease) both; }
    #launch img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 16px 40px -14px rgba(0, 122, 104, .55); }
    #launch span { font-size: 26px; font-weight: 800; color: var(--ink); }
    @keyframes launchIn { from { opacity: 0; transform: scale(.92); } to { opacity: 1; transform: none; } }

    @media (prefers-reduced-motion: reduce) {
      .sway, .cloud, .sun-glow, .cel-rays { animation: none !important; }
    }
  </style>
</head>
<body>
  <div id="launch" aria-hidden="true"><div class="l-wrap"><img src="icons/icon-192.png" alt="" /><span>نَقَاء</span></div></div>
  <div id="navbar" class="navbar" aria-hidden="true"><span id="navbar-title"></span></div>
  <noscript><p style="padding:24px;text-align:center">يحتاج نَقَاء إلى تفعيل JavaScript ليعمل.</p></noscript>

  <div class="app">
    <main id="view-today" class="view" aria-label="اليوم"></main>
    <main id="view-journey" class="view" aria-label="الرحلة" hidden></main>
    <main id="view-sos" class="view" aria-label="النجدة" hidden></main>
    <main id="view-me" class="view" aria-label="أنا" hidden></main>
  </div>

  <nav class="tabbar" aria-label="التنقل الرئيسي">
    <button class="tab" data-action="tab" data-tab="today" aria-current="page"><i data-i="sun"></i><span>اليوم</span></button>
    <button class="tab" data-action="tab" data-tab="journey"><i data-i="route"></i><span>الرحلة</span></button>
    <button class="tab tab-sos" data-action="tab" data-tab="sos" aria-label="النجدة: أدوات تجاوز الرغبة"><span class="sos-core"><i data-i="wind"></i></span><span>نجدة</span></button>
    <button class="tab" data-action="tab" data-tab="me"><i data-i="user"></i><span>أنا</span></button>
  </nav>

  <!-- Full-screen SOS session -->
  <section id="session" class="session" hidden role="dialog" aria-modal="true" aria-label="جلسة ٣ دقائق">
    <div class="session-inner">
      <div class="row between">
        <button class="btn sm" data-action="sessionEnd"><i data-i="x" class="sm"></i>إنهاء</button>
        <div class="center">
          <div class="xs muted">جلسة ٣ دقايق</div>
          <div id="ss-timer" class="timer-big num">٠٣:٠٠</div>
        </div>
        <button class="icon-btn" data-action="sessionPause" id="ss-pause" aria-label="إيقاف مؤقت"><i data-i="pause" class="sm"></i></button>
      </div>

      <div class="card tight">
        <svg id="ss-wave" class="wave-svg" viewBox="0 0 320 110" preserveAspectRatio="none" aria-hidden="true"></svg>
        <p id="ss-phase" class="small center bold" style="margin:6px 0 0">الرغبة تزيد — تنفّس معها ولا تقاومها</p>
      </div>

      <div class="seg" role="tablist" id="ss-tools">
        <button data-action="sessionTool" data-tool="breath" aria-pressed="true">تنفّس</button>
        <button data-action="sessionTool" data-tool="remind" aria-pressed="false">تذكير</button>
      </div>

      <div id="ss-tool-breath" class="col"></div>
      <div id="ss-tool-remind" class="col" hidden></div>

      <button class="btn grad block" data-action="sessionWon"><i data-i="shield-check" class="sm"></i>عدّيت الرغبة</button>
    </div>
  </section>

  <!-- Onboarding -->
  <section id="onb" class="onb" hidden role="dialog" aria-modal="true" aria-label="إعداد خطتك">
    <div class="onb-inner">
      <div class="row">
        <button class="icon-btn sm" data-action="onbBack" id="onb-back" aria-label="رجوع"><i data-i="chevron-right" class="sm"></i></button>
        <div class="steps" id="onb-steps"><i></i><i></i><i></i><i></i><i></i></div>
        <button class="icon-btn sm" data-action="onbClose" id="onb-close" aria-label="إغلاق"><i data-i="x" class="sm"></i></button>
      </div>
      <div class="onb-body" id="onb-body"></div>
      <div class="onb-actions" id="onb-actions"></div>
    </div>
  </section>

  <!-- Bottom sheet -->
  <div id="sheet-layer" class="sheet-layer" hidden>
    <div class="sheet-backdrop" data-action="closeSheet"></div>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-grab"><div class="sheet-handle"></div></div>
      <div class="sheet-body" id="sheet-body"></div>
    </div>
  </div>

  <div id="toast" role="status" aria-live="polite"><span id="toast-ic"></span><span id="toast-text"></span></div>
  <div id="tip"></div>
  <canvas id="confetti"></canvas>
  <input id="import-file" type="file" accept="application/json" hidden />

  <script>

  const toNum = t => { const v = Number(String(t).replace(/[٠-٩]/g, d => '٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[^0-9]/g, '')); return Number.isFinite(v) && v > 0 ? v : null; };
  function backupDue(m) { return !m.prep && m.pd >= 3 && Date.now() - (state.lastBackup || 0) > 7 * 864e5; }

  const afterIdx = m => clamp(Math.floor((m.pd - 30) / 7), 0, AFTER30.length - 1);

  /* Honest slip log + 24h recovery plan (no reset) */

  const SYMPTOMS = [
    { icon: 'waves', t: 'رغبات مفاجئة', from: 1, to: 30, d: 'تبلغ ذروتها ثم تنحسر خلال دقائق. افتح «نجدة» واصبر ٣ دقائق.' },

    { icon: 'brain', t: 'صداع أو ثقل في الرأس', from: 1, to: 7, d: 'شائع في الأيام الأولى. اشرب ماءً كثيراً، ونم جيداً، وخذ استراحات من الشاشة.' },

    { icon: 'utensils', t: 'جوع زائد', from: 2, to: 30, d: 'النيكوتين كان يكبت الشهية. جهّز وجبات خفيفة صحية واشرب الماء قبل الأكل.' },
    { icon: 'cloud', t: 'مزاج منخفض أو ملل', from: 3, to: 21, d: 'دماغك يعيد ضبط نظام المكافأة. الحركة والشمس والحديث مع من تحب تساعد. إن اشتد الحزن فاستشر مختصاً.' },

  function symptomsHTML(day) {

  }

  let checkinEditing = false;

  /* ---------- Journey: "where am I, how much is left, what's next?" ---------- */
  let openWeek = null, selDay = null, showAllBody = false;
  const MS_NEED = { h24: 24, h72: 72, d7: 168, d14: 336, d30: 720 };

  }

  RENDER.journey = function () {

    let html = `<header class="topbar"><h1 class="h1">رحلتك</h1></header>`;

    if (m.prep) {

    const list = showAllBody ? BODY.map((b, i) => i) : [nextI - 1, nextI, nextI + 1].filter(i => i >= 0 && i < BODY.length);

  function icsDate(d) { return d.getFullYear() + pad2(d.getMonth() + 1) + pad2(d.getDate()) + 'T' + pad2(d.getHours()) + pad2(d.getMinutes()) + '00'; }
  function buildICS(am, pm) {
    const m = metrics(), base = new Date(Math.max(Date.now(), m.st));
    const at = (hm, title, desc, id) => {
      const [h, mi] = hm.split(':').map(Number); const d = new Date(base); d.setHours(h, mi, 0, 0); if (d.getTime() < Date.now()) d.setDate(d.getDate() + 1);
      const stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d+/, '');
      return ['BEGIN:VEVENT', 'UID:naqa-' + id + '-' + Date.now() + '@naqa', 'DTSTAMP:' + stamp, 'DTSTART:' + icsDate(d), 'DURATION:PT5M', 'RRULE:FREQ=DAILY;COUNT=' + (m.free ? 60 : 33), 'SUMMARY:' + title, 'DESCRIPTION:' + desc, 'BEGIN:VALARM', 'ACTION:DISPLAY', 'TRIGGER:PT0M', 'DESCRIPTION:' + title, 'END:VALARM', 'END:VEVENT'].join('\r\n');
    };
    return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Naqa//AR', 'CALSCALE:GREGORIAN',
      at(am, 'نَقَاء: مهمتك الصباحية', 'افتح نقاء وشوف مهمتك التالية', 'am'),
      at(pm, 'نَقَاء: مراجعة المساء', 'دقيقة وحدة: مزاجك ورغبتك اليوم', 'pm'), 'END:VCALENDAR'].join('\r\n');
  }

      </div>
      <p class="xs muted" style="margin:0;line-height:1.8">${ic('info', 'xs')} بعد الضغط يفتح جوالك ملف تقويم — اختر «إضافة الكل». التذكيرات تشتغل حتى لو التطبيق مقفل.</p>

  let lastDay = null, lastPrep = null, lastDK = null;
  function updateLive(m) {
    if (currentTab !== 'today') return;
    const set = (k, v) => { const el = $(`[data-live="${k}"]`); if (el && el.textContent !== v) el.textContent = v; };
    const cp = counterParts(m); if (!counting) set('big', cp.big); set('unit', cp.unit); set('lbl', cp.lbl);
    const pr = $('[data-live="prog"]'); if (pr) pr.style.width = Math.max(2, clamp(m.pd / 30 * 100, 0, 100)) + '%';
    const ns = nextStop(m);
    set('next', !m.prep && ns ? ns.t + ' بعد ' + fmtDur(ns.h - m.H) : '');
    set('saved', nf(m.saved, 0));
    set('avoided', nf(Math.floor(m.avoided)));
    set('goalPct', nf(Math.floor(m.goalPct)) + '٪');
  }
  function tick() {
    const m = metrics();
    const dk = dateKey();
    const dayChanged = lastDay !== null && (m.day !== lastDay || m.prep !== lastPrep || (lastDK && dk !== lastDK));
    lastDay = m.day; lastPrep = m.prep; lastDK = dk;
    if (dayChanged) { previewDay = null; selDay = null; openWeek = null; rerender(); } else updateLive(m);
    checkCelebrations(m);
  }

  function checkCelebrations(m) {
    if (!state.onboarded || m.prep || !$('#sheet-layer').hidden || !$('#session').hidden || !$('#onb').hidden || $('.celebrate')) return;
    const newly = BADGES.filter(b => b.ok(m) && !state.badgesSeen.includes(b.id));
    if (!newly.length) return;
    state.badgesSeen.push(...newly.map(b => b.id)); save();
    celebrate(newly[newly.length - 1]);
  }

    document.body.classList.remove('sheet-open');
    document.body.style.overflow = '';
    layer.classList.add('closing');
    closeT = setTimeout(() => { layer.hidden = true; layer.classList.remove('closing'); $('.sheet').style.transform = ''; }, reduceMotion() ? 0 : 250);
    const cb = sheetClose; sheetClose = null; if (cb) cb();
  }

  /* Cloud sheet */
  /* =========================================================
     SOS SESSION
     ========================================================= */
  const SESSION_LEN = 180;
  const sess = { end: 0, left: SESSION_LEN, paused: false, timer: null, tool: 'breath' };
  const waveF = t => (t / 50) * Math.exp(1 - t / 50); // peaks at 50s
  function sessionStart() {
    sess.left = SESSION_LEN; sess.paused = false; sess.end = Date.now() + SESSION_LEN * 1000;
    $('#session').hidden = false; document.body.style.overflow = 'hidden';
    setSessionTool('breath');
    drawWave(0);
    clearInterval(sess.timer); sess.timer = setInterval(sessionTick, 250);
    sessionTick(); buzz(20);
  }
  function sessionTick() {
    if (!sess.paused) sess.left = Math.max(0, (sess.end - Date.now()) / 1000);
    const s = Math.ceil(sess.left);
    $('#ss-timer').textContent = ar(pad2(Math.floor(s / 60)) + ':' + pad2(s % 60));
    const t = SESSION_LEN - sess.left;
    drawWave(t);
    $('#ss-phase').textContent = t < 35 ? 'الرغبة تزيد — تنفّس معها ولا تقاومها' : t < 70 ? 'أنت في القمّة — أكثر من كذا ما بتزيد' : sess.left > 0 ? 'الرغبة تخف — كمّل' : 'عدّيتها.';
    if (sess.left <= 0) { clearInterval(sess.timer); sess.timer = null; finishSession(true); }
  }
  function drawWave(t) {
    const W = 320, H = 110, pad = 8;
    const x = s => W - pad - (s / SESSION_LEN) * (W - pad * 2);
    const y = v => H - 14 - v * (H - 34);
    let d = '';
    for (let s = 0; s <= SESSION_LEN; s += 3) d += (s ? 'L' : 'M') + x(s).toFixed(1) + ',' + y(waveF(s)).toFixed(1);
    let dp = '';
    for (let s = 0; s <= t; s += 2) dp += (s ? 'L' : 'M') + x(s).toFixed(1) + ',' + y(waveF(s)).toFixed(1);
    const cx = x(t), cy = y(waveF(t));
    $('#ss-wave').innerHTML = `
      <path d="${d} L${x(SESSION_LEN)},${H - 14} L${x(0)},${H - 14} Z" fill="var(--sage-soft)"/>
      <path d="${d}" fill="none" stroke="var(--line-2)" stroke-width="2" stroke-dasharray="3 5"/>
      ${dp ? `<path d="${dp}" fill="none" stroke="var(--sage)" stroke-width="2.5" stroke-linecap="round"/>` : ''}

      <circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="6" fill="var(--sand)" stroke="var(--surface)" stroke-width="2"/>`;
  }
